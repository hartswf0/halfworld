function fitPerformanceCamera(){
  const W=innerWidth,H=innerHeight;
  camera.aspect=W/H;
  camera.updateProjectionMatrix();
  const readRect=readout.getBoundingClientRect();
  const joyRect=$('#joys').getBoundingClientRect();

  const z=viewportWorldH/(2*Math.tan(halfFov));
  const worldCenter=(worldTop+worldBottom)*.5;

  const pxPerWorld=H/viewportWorldH;
  const camY=worldCenter+(desiredScreenCenter-H*.5)/pxPerWorld;

  camera.rotation.set(0,0,0);
