<script>
"use strict";
/* ======================================================================
   ORB CARTOON · v2 — one substance, four observers

   THE THEORY, IN THE CODE'S OWN WORDS
   A <mark> is a set of directions on a shell of radius d, with a width in
   degrees and a life: HELD (from a frame until cut) or SAMPLED (one frame).
   That is the whole store. The hand lays HELD marks by touch. An author
   without hands — a cartoon, or an agent — draws on a flat <page>, and a
   <chart> (TANGENT · BAND · CAP · SHEET) turns page points into directions.
   The author never sees a direction. The equirectangular sheet is not the
   store; it is one <observer> among four (ORB, VIEW, SHEET, PAGE), and the
   dot lattice is not the store either; it is one <renderer> (DOTS) beside
   PATH. Depth is shells; parallax is geometry: a mark at direction n on
   shell d, seen from a camera translated by t, is norm(d·n − t). A camera
   PAN is a rotation of the world (no parallax, as in optics); a TRUCK is
   a translation (parallax); the cartoon says how much of its pan is truck.
   Rotation of the audience's heading is never in the score. The sphere
   film is written from the centre and marked as such; the shot film is
   what VIEW sees. Every ceiling is stated before the work.

   THE AUTHOR CONTRACT — what a .js file must do to play here
     ORB.register(function(ST){
       const S=ST.makeShot('SHOT 01',96,{hero:{x:180,y:120}});
       S.key(0,'K01','sits'); S.key(40,'B','hops',{hero:{x:220,y:100}});
       S.cam(0,180,120,1); S.cam(95,200,120,1.1);      // cx cy zoom, in page px
       S.sfx(40,'boing',[180,120]);                    // optional page point → the cue has a direction
       S.draw=(state,cam,r,vis)=>{ ST.plane(4,cam,()=>{ ...wall, drawn with ST.ctx... });
                                   ST.plane(1,cam,()=>{ ...hero... }); };
       return {name:'MY CARTOON', W:360,H:240, fps:24, twos:true, paper:'#f2ead8',
               window:{size:100,lon:0,lat:8}, truck:.25,
               planes:[{label:'P1 wall',d:4,chart:'BAND'},{label:'P0 hero',d:1,chart:'TANGENT'}],
               shots:[S], SFX:{boing:()=>ST.o('sine',190,95,.4,.2)}};
     });
   ST.ctx is a recorder shaped like a 2D canvas context (save/translate/
   rotate/scale, beginPath/moveTo/lineTo/arc/ellipse/rect, fill/stroke/
   clip, fillRect, fillText). Everything drawn through it becomes page-
   marks; ST.plane(d,cam,fn) charts them onto shell d. ST.ink/ell/arc/rect/
   rng are the rough hand-drawn kit on top of it.

   CEILINGS
     STEP 2° along an arc · a fill wider than 30° is cut into ≤ 400 page cells · page ≤ 180° (warned past 100°) · |truck| < nearest
     shell (the frame is refused, and says which) · marks per frame ≤ 20 000 ·
     stroke width ≤ 60 px · sheet raster 1024 (768 narrow) for DOTS/VIEW-raster ·
     out ≤ 4096 · film realtime, refused if the first second falls behind ·
     a cartoon ≤ 64 shots, ≤ 20 000 frames · hand marks ≤ 3000
   ====================================================================== */
const TAU=Math.PI*2,PI=Math.PI,D2R=PI/180,R2D=180/PI;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len3=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len3(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const dirLL=(lam,phi)=>{const c=Math.cos(phi);return [c*Math.sin(lam),Math.sin(phi),c*Math.cos(lam)];};
const llDir=d=>[Math.atan2(d[0],d[2]),Math.asin(clamp(d[1],-1,1))];
const upFor=d=>Math.abs(d[1])>.985?[0,0,1]:[0,1,0];
const basis=(f,up)=>{const F=norm(f),r=norm(cross(up,F));return {f:F,r,u:cross(F,r)};};
const rotAx=(d,ax,a)=>{const k=norm(ax),c=Math.cos(a),s=Math.sin(a);return add(add(mul(d,c),mul(cross(k,d),s)),mul(k,dot(k,d)*(1-c)));};
const ang=(a,b)=>2*Math.asin(clamp(len3(sub(a,b))/2,0,1));
const slerp=(a,b,t)=>{const w=ang(a,b);if(w<1e-6)return a;const s=Math.sin(w);return norm(add(mul(a,Math.sin((1-t)*w)/s),mul(b,Math.sin(t*w)/s)));};

/* ================= charts: a flat page, a region of the sphere ================= */
const STEP=2*D2R,PAGE_MAX=180,PAGE_WARN=100;
function makeChart(spec){
  const kind=spec.kind||'TANGENT',W=spec.W,H=spec.H,size=spec.size,roll=(spec.roll||0)*D2R;
  const f=dirLL((spec.lon||0)*D2R,(spec.lat||0)*D2R);let B=basis(f,upFor(f));
  if(roll){B={f:B.f,r:rotAx(B.r,B.f,roll),u:rotAx(B.u,B.f,roll)};}
  const C={kind,W,H,size,lon:spec.lon||0,lat:spec.lat||0,B};
  if(kind==='TANGENT'){
    C.ok=()=>size<PAGE_MAX?null:'a tangent page must be under '+PAGE_MAX+'°';
    C.warn=()=>size>=PAGE_WARN?'a tangent page of '+size+'° stretches its corners; a band may serve':null;
    const T=Math.tan(size/2*D2R);
    C.fwd=(x,y)=>{const px=(x-W/2)/(W/2)*T,py=-(y-H/2)/(W/2)*T;return norm(add(add(B.f,mul(B.r,px)),mul(B.u,py)));};
    C.inv=d=>{const z=dot(d,B.f);if(z<=1e-6)return null;return [W/2+dot(d,B.r)/z/T*W/2,H/2-dot(d,B.u)/z/T*W/2];};
    C.scale=size/W;}
  else if(kind==='BAND'){
    const k=size/W;
    C.ok=()=>Math.abs(C.lat)+H*k/2<90?null:'a band must stay off the poles';C.warn=()=>null;
    C.fwd=(x,y)=>dirLL((C.lon+(x-W/2)*k)*D2R,clamp(C.lat-(y-H/2)*k,-89.5,89.5)*D2R);   /* a band cannot go over the pole; past it, it pins */
    C.inv=d=>{const ll=llDir(d);let lon=ll[0]*R2D-C.lon;while(lon>180)lon-=360;while(lon<-180)lon+=360;return [W/2+lon/k,H/2-(ll[1]*R2D-C.lat)/k];};
    C.scale=k;}
  else if(kind==='CAP'){
    const k=size/(W/2);
    C.ok=()=>size<PAGE_MAX?null:'a cap must be under '+PAGE_MAX+'° of radius';C.warn=()=>null;
    C.fwd=(x,y)=>{const dx=x-W/2,dy=y-H/2,rho=Math.hypot(dx,dy),a=Math.min(rho*k,size)*D2R,th=Math.atan2(-dy,dx);   /* a cap ends at its rim: page points past it pin there, so a fill of the page fills the cap */
      return norm(add(mul(B.f,Math.cos(a)),mul(add(mul(B.r,Math.cos(th)),mul(B.u,Math.sin(th))),Math.sin(a))));};
    C.inv=d=>{const a=Math.acos(clamp(dot(d,B.f),-1,1)),rho=a*R2D/k,th=Math.atan2(dot(d,B.u),dot(d,B.r));return [W/2+rho*Math.cos(th),H/2-rho*Math.sin(th)];};
    C.scale=k;}
  else{ /* SHEET: the equirectangle itself, chosen on purpose */
    C.ok=()=>null;C.warn=()=>null;
    C.fwd=(x,y)=>dirLL((x/W-.5)*TAU,(.5-y/H)*PI);
    C.inv=d=>{const ll=llDir(d);return [(ll[0]/TAU+.5)*W,(.5-ll[1]/PI)*H];};
    C.scale=360/W;}
  return C;}

/* ================= ST · the studio an author draws with ================= */
const ST={inkColour:'#000'};
/* The recorder: shaped like a 2D context, but it keeps page-marks instead of
   pixels. An author writes canvas code and never learns it drew on a ball. */
function Rec(){this.marks=[];this.s={fill:'#000',stroke:'#000',lw:1,alpha:1,font:12,align:'left',xf:[1,0,0,1,0,0],clip:null};this.stack=[];this.path=[];this.cur=null;}
Rec.prototype={
  get fillStyle(){return this.s.fill},set fillStyle(v){this.s.fill=v},
  get strokeStyle(){return this.s.stroke},set strokeStyle(v){this.s.stroke=v},
  get lineWidth(){return this.s.lw},set lineWidth(v){this.s.lw=v},
  get globalAlpha(){return this.s.alpha},set globalAlpha(v){this.s.alpha=v},
  get font(){return this.s.font+'px'},set font(v){const m=/([\d.]+)px/.exec(v||'');this.s.font=m?+m[1]:12},
  get textAlign(){return this.s.align},set textAlign(v){this.s.align=v},
  set lineJoin(v){},set lineCap(v){},
  save(){this.stack.push({...this.s,xf:this.s.xf.slice()})},restore(){const p=this.stack.pop();if(p)this.s=p},
  mulXf(m){const a=this.s.xf,b=m;this.s.xf=[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]]},
  translate(x,y){this.mulXf([1,0,0,1,x,y])},rotate(a){const c=Math.cos(a),s=Math.sin(a);this.mulXf([c,s,-s,c,0,0])},scale(x,y){this.mulXf([x,0,0,y==null?x:y,0,0])},
  setTransform(a,b,c,d,e,f){this.s.xf=[a,b,c,d,e,f]},
  ap(x,y){const m=this.s.xf;return [m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]]},
  sc(){const m=this.s.xf;return Math.sqrt(Math.abs(m[0]*m[3]-m[1]*m[2]))},
  beginPath(){this.path=[];this.cur=null},moveTo(x,y){this.cur=[[x,y]];this.path.push(this.cur)},lineTo(x,y){if(!this.cur)return this.moveTo(x,y);this.cur.push([x,y])},
  closePath(){if(this.cur)this.cur.closed=true},
  rect(x,y,w,h){const r=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];r.closed=true;this.path.push(r);this.cur=null},
  arc(cx,cy,r,a0,a1,ccw){this.ellipse(cx,cy,r,r,0,a0,a1,ccw)},
  ellipse(cx,cy,rx,ry,rot,a0,a1,ccw){const n=24,pts=[];let d=a1-a0;if(ccw){if(d>0)d-=TAU;}else if(d<0)d+=TAU;if(Math.abs(d)<1e-9)d=ccw?-TAU:TAU;
    const c=Math.cos(rot||0),s=Math.sin(rot||0);for(let i=0;i<=n;i++){const a=a0+d*i/n,x=Math.cos(a)*rx,y=Math.sin(a)*ry;pts.push([cx+x*c-y*s,cy+x*s+y*c]);}
    if(Math.abs(Math.abs(d)-TAU)<1e-6){pts.pop();pts.closed=true;this.path.push(pts);this.cur=null;}else{if(this.cur)this.cur.push(...pts);else{this.cur=pts;this.path.push(pts);}}},
  rings(){return this.path.filter(r=>r.length>1).map(r=>{const o=r.map(p=>this.ap(p[0],p[1]));o.closed=!!r.closed;return o;})},
  clipRings(rings){const c=this.s.clip;if(!c)return rings;return rings.map(r=>{const o=clipConvex(r,c);o.closed=true;return o;}).filter(r=>r.length>2)},
  fill(rule){const rings=this.clipRings(this.rings());if(rings.length)this.marks.push({kind:'FILL',rings,col:this.s.fill,alpha:this.s.alpha,rule:rule==='evenodd'?'evenodd':'nonzero'})},
  stroke(){const w=this.s.lw*this.sc();for(const r of this.rings())this.marks.push({kind:'ARC',pts:r,closed:!!r.closed,col:this.s.stroke,w,alpha:this.s.alpha})},
  clip(){const r=this.rings()[0];this.s.clip=r&&r.length>2?r:null},
  fillRect(x,y,w,h){this.beginPath();this.rect(x,y,w,h);this.fill()},
  strokeRect(x,y,w,h){this.beginPath();this.rect(x,y,w,h);this.stroke()},
  fillText(t,x,y){this.marks.push({kind:'TEXT',p:this.ap(x,y),text:String(t),size:this.s.font*this.sc(),col:this.s.fill,align:this.s.align,alpha:this.s.alpha})}};
/* Sutherland–Hodgman against a convex ring (a clip circle from arc+clip) */
function clipConvex(poly,clip){let out=poly.slice();const n=clip.length;
  let area=0;for(let i=0;i<n;i++){const a=clip[i],b=clip[(i+1)%n];area+=a[0]*b[1]-b[0]*a[1];}const sgn=area>=0?1:-1;
  for(let i=0;i<n&&out.length;i++){const a=clip[i],b=clip[(i+1)%n],inp=out;out=[];
    const inside=p=>sgn*((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]))>=0;
    const cut=(p,q)=>{const d1=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]),d2=(b[0]-a[0])*(q[1]-a[1])-(b[1]-a[1])*(q[0]-a[0]),t=d1/(d1-d2);return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t];};
    for(let j=0;j<inp.length;j++){const p=inp[j],q=inp[(j+1)%inp.length],pi=inside(p),qi=inside(q);
      if(pi){out.push(p);if(!qi)out.push(cut(p,q));}else if(qi)out.push(cut(p,q));}}
  return out;}
ST.ctx=new Rec();
ST.rng=function(seed){let s=(seed*9301+49297)|0;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
ST.roughPts=function(pts,r,jit,closed){const out=[],n=pts.length,segs=closed?n:n-1;for(let i=0;i<segs;i++){const a=pts[i],b=pts[(i+1)%n];const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;const nx=-dy/len,ny=dx/len;const k=Math.max(2,Math.ceil(len/6));for(let j=0;j<k;j++){const t=j/k,o=(r()-.5)*2*jit;out.push({x:a.x+dx*t+nx*o,y:a.y+dy*t+ny*o})}}if(!closed)out.push(pts[n-1]);return out}

        for(const ring of m.rings){const vs=clipRing3(ring.map(d=>O.to3(seen(d,m.shell))),O.eps);if(vs.length<3)continue;let px=vs.map(v=>O.proj(v));
          if(O.wrap){px=unwrap(px,O.wrap);const gap=px[0][0]-px[px.length-1][0];
            /* a ring that goes once round a pole has no area on the sheet until it is closed along the sheet's edge: the pole is inside it */
            if(Math.abs(gap)>O.wrap/2){let sy=0;for(const d of ring)sy+=d[1];const edge=sy<0?H:0;px=px.concat([[px[px.length-1][0],edge],[px[0][0],edge]]);}}
          for(let i=0;i<px.length;i++){const p=px[i];if(i)g.lineTo(p[0]+sh,p[1]);else g.moveTo(p[0]+sh,p[1]);}g.closePath();any=true;}
        if(any)g.fill(m.rule||'nonzero');}}
    else if(m.kind==='TEXT'){const v=O.to3(seen(m.p,m.shell));if(v[2]<=O.eps)continue;const p=O.proj(v),px=clamp(m.size*O.pxdeg(v),3,200);
      g.fillStyle=m.col;g.font=px+'px "IBM Plex Mono",monospace';g.textAlign=m.align||'left';g.fillText(m.text,p[0],p[1]);}}

/* paper: the ball's ground before any mark, for observers that see it */
function paperFor(g,O,W,H,col){g.fillStyle='#fff';g.fillRect(0,0,W,H);
  if(O.kind==='ORB'){g.fillStyle=col;g.beginPath();g.arc(O.cx,O.cy,O.Rd,0,TAU);g.fill();}else{g.fillStyle=col;g.fillRect(0,0,W,H);}}
function renderTo(cv,kind,f){const g=cv.getContext('2d'),W=cv.width,H=cv.height,O=observer(kind,W,H);
  paperFor(g,O,W,H,cart?cart.paper:'#fff');
  if(FRAME.refused){g.fillStyle='#000';g.font=Math.round(W/40)+'px "IBM Plex Mono",monospace';g.textAlign='center';g.fillText(FRAME.refused,W/2,H/2);return;}
  drawMarks(g,O,slice(f),W,H);
  if(kind==='ORB'){g.strokeStyle='#000';g.lineWidth=Math.max(1,W/460);g.beginPath();g.arc(O.cx,O.cy,O.Rd,0,TAU);g.stroke();}
  if(kind==='SHEET'){g.strokeStyle='#000';g.lineWidth=1;g.setLineDash([2,4]);g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.moveTo(W/2,0);g.lineTo(W/2,H);g.stroke();g.setLineDash([]);}}
/* the PAGE observer: what the author saw — its own flat page, un-charted */
function renderPage(cv,label){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.fillStyle='#fff';g.fillRect(0,0,W,H);if(!cart)return;
  const pw=cart.W,ph=cart.H,s=Math.min(W/pw,H/ph)*.92,ox=(W-pw*s)/2,oy=(H-ph*s)/2;
  g.save();g.translate(ox,oy);g.scale(s,s);g.fillStyle=cart.paper;g.fillRect(-pw*2,-ph*2,pw*5,ph*5);
  const pm=PAGES[label]||[];

    if(m.kind==='ARC'){g.strokeStyle=m.col;g.lineWidth=m.w;g.lineJoin='round';g.lineCap='round';g.beginPath();m.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));if(m.closed)g.closePath();g.stroke();}
    else if(m.kind==='FILL'){g.fillStyle=m.col;g.beginPath();for(const r of m.rings){r.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();}g.fill(m.rule||'nonzero');}
    else if(m.kind==='TEXT'){g.fillStyle=m.col;g.font=m.size+'px "IBM Plex Mono",monospace';g.textAlign=m.align||'left';g.fillText(m.text,m.p[0],m.p[1]);}}

  g.fillStyle='#000';g.font=Math.round(11*DPR)+'px "IBM Plex Mono",monospace';g.textAlign='left';g.fillText(label+' · '+(pm.length)+' page-marks · the page, before the chart',8*DPR,16*DPR);}
/* DOTS: the sheet as a bake, read through the lattice — the old idiom, now a way of looking */
const narrow=Math.min(screen.width,screen.height)<420,BAKE_W=narrow?768:1024,DOT_MAX=80000;
const BAKE={cv:document.createElement('canvas'),data:null,key:''};
function bake(f){const key=FRAME.key+':'+f+':'+HAND.length;if(BAKE.key===key)return;BAKE.cv.width=BAKE_W;BAKE.cv.height=BAKE_W>>1;renderTo(BAKE.cv,'SHEET',f);

function drawDots(f){bake(f);const R=rotM(V.yaw,V.pitch),cx=SW/2,cy=SH/2,Rd=Math.min(SW,SH)*.45;let step=1.4;while((360/step)*(180/step)>DOT_MAX)step+=.1;const cell=Rd*step*D2R;
  sg.fillStyle='#fff';sg.fillRect(0,0,SW,SH);sg.beginPath();sg.arc(cx,cy,Rd,0,TAU);sg.fill();const d=BAKE.data,Wb=BAKE_W,Hb=BAKE_W>>1;
  for(let lat=-90+step/2;lat<90;lat+=step){const cp=Math.cos(lat*D2R),sp=Math.sin(lat*D2R);
    for(let lon=-180;lon<180;lon+=step){const lam=lon*D2R,dir=[cp*Math.sin(lam),sp,cp*Math.cos(lam)],v=mv(R,dir);if(v[2]<0)continue;
      const x=((lon+180)/360*Wb)|0,y=clamp(((90-lat)/180*Hb)|0,0,Hb-1),j=(y*Wb+x)*4,l=(d[j]*.299+d[j+1]*.587+d[j+2]*.114)/255;
      const rad=cell*(.08+.62*(1-l))*Math.max(cp,.35);if(rad<.4)continue;sg.fillStyle='rgb('+d[j]+','+d[j+1]+','+d[j+2]+')';
      sg.fillRect(cx+v[0]*Rd-rad,cy-v[1]*Rd-rad,rad*2,rad*2);}}
  sg.strokeStyle='#000';sg.lineWidth=Math.max(1,DPR);sg.beginPath();sg.arc(cx,cy,Rd,0,TAU);sg.stroke();}

/* ================= COMMON ORB FIELD: a town of citizens ================= */
/* A citizen is a person file hung on the town's shell at an address, on its
   own clock, performing one of its clips. Its outside is its figure planes,
   charted at the address; its inside is its whole cartoon — ENTER swaps the
   store. An encounter is two figures within REACH degrees on one shell; it
   writes the ledger once per meeting. FORK copies the town from now.
   Ceilings: citizens ≤ 64 · ledger ≤ 400 lines · the town loops at 576 ticks. */
const REACH=12,CITIZENS_MAX=64,LEDGER_MAX=400,FRAMES_WORLD=576;
let MODE='WORLD',WORLDS=[],WI=0,ENTERED=null,ledgerDirty=true;
const WORLD=()=>WORLDS[WI];
function makeWorld(name,setCart){return {name,set:setCart,frame:0,citizens:[],ledger:[],contacts:{}};}
function addCitizen(w,spec){if(w.citizens.length>=CITIZENS_MAX){ttrace('the town holds '+CITIZENS_MAX);return null;}
  const c=Object.assign({lon:0,lat:-10,d:1,scale:.4,clock:1,clip:null,drift:0,pos:null,memory:[],marks:null,key:''},spec);if(!c.clip)c.clip=Object.keys(c.person.person.clips)[0];w.citizens.push(c);return c;}
function localFrame(c,wf){const cl=c.person.person.clips[c.clip];const len=cl[2]-cl[1]+1;return {shot:cl[0],f:cl[1]+Math.floor(wf*c.clock)%len};}
const siteNear=(w,lon)=>{const S=w.set.sites||[];let b=null,bd=1e9;for(const s of S){const d=Math.abs(((lon-s.lon+540)%360)-180);if(d<bd){bd=d;b=s;}}return b?b.name.toLowerCase():'the road';};
/* one citizen's outside, at this world frame */
function authorExterior(c,wf){const P=c.person,{shot,f}=localFrame(c,wf),S=P.shots[shot],df=P.twos?f-(f%2):f,seed=(P.twos?df/2:df)+1+shot*1000;
  const lon=c.lon+c.drift*Math.sin(wf/90),key=[P.name,shot,df,lon.toFixed(1),c.lat,c.scale,c.d].join(':');
  if(c.key===key)return c.marks;
  const prev=cart;cart=P;const keep=CURMARKS,keepLife=CURLIFE;CURMARKS=[];CURLIFE={f:df};
  EXT={figure:P.person.figure,lon,lat:c.lat,scale:c.scale,d:c.d,name:c.name};
  const r=()=>ST.rng(seed),s=ST.sample(S.K,df),cam=ST.sample(S.CAM,df);
  try{S.draw(s,cam,r,P.planes.map(()=>1));}catch(e){ttrace(c.name+' failed: '+e.message);}
  try{const w=P.person.where(s),C=extChart(P,P.planes.find(p=>p.label===P.person.figure[0]));c.pos=C.fwd(w[0],w[1]);}catch(e){c.pos=dirLL(lon*D2R,c.lat*D2R);}
  EXT=null;c.marks=CURMARKS;c.key=key;CURMARKS=keep;CURLIFE=keepLife;cart=prev;return c.marks;}
function encounters(w,wf){const cs=w.citizens;for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){const a=cs[i],b=cs[j];if(!a.pos||!b.pos||a.d!==b.d)continue;const k=a.name+'|'+b.name,near=ang(a.pos,b.pos)*R2D<REACH;
    if(near&&!w.contacts[k]){w.contacts[k]=wf;const where=siteNear(w,llDir(a.pos)[0]*R2D);const as=!!a.person.person.stays,bs=!!b.person.person.stays;const mover=as&&!bs?b:a,other=mover===a?b:a;
      const text=other.person.person.stays?mover.name+' passes '+other.name+' at '+where+' · '+other.name+' watches':as&&bs?a.name+' and '+b.name+' wait at '+where:mover.name+' passes '+other.name+' at '+where;w.ledger.push({f:wf,text,rel:'trust +1'});if(w.ledger.length>LEDGER_MAX)w.ledger.shift();a.memory.push('met '+b.name+' at '+where);b.memory.push('met '+a.name+' at '+where);ledgerDirty=true;}
    if(!near&&w.contacts[k]!=null&&wf-w.contacts[k]>24)delete w.contacts[k];}}
function worldFrame(wf){const w=WORLD();const prev=cart;cart=w.set;FRAME.key='';authorFrame(0,wf%w.set.total,w.set.planes.map(()=>1));const marks=FRAME.marks.slice();cart=prev;
  for(const c of w.citizens)for(const m of authorExterior(c,wf))marks.push(m);
  encounters(w,wf);const t=INTRO.on?[0,0,0]:townCam(wf);FRAME.marks=withGrid(marks);FRAME.df=-1;FRAME.world={rot:d=>d,t,B:null};FRAME.t=t;FRAME.refused=null;FRAME.key='WORLD:'+wf;}
function worldPaint(){const w=WORLD();const n0=w.ledger.length;worldFrame(w.frame);
  if(w.ledger.length>n0&&!INTRO.on){const l=w.ledger[w.ledger.length-1];say(siteNear(w,llDir(w.citizens.find(x=>l.text.indexOf(x.name)===0).pos)[0]*R2D).toUpperCase()+'  ·  '+l.text+'  ·  '+l.rel,4500);heard(w,l);}
  if(FRAMECHROME){const intro=introFrame(performance.now());const view=intro?V.view:(peek?'ORB':'VIEW');renderTo(stage,view,w.frame);if(!peek&&!intro)edgeMarks(w);
    if(intro&&V.view==='ORB'){const O=observer('ORB',SW,SH);for(const c of w.citizens){if(!c.pos)continue;const v=O.to3(c.pos);if(v[2]<=0)continue;const p=O.proj(v);sg.fillStyle='#000';sg.font=Math.round(9*DPR)+'px "IBM Plex Mono",monospace';sg.textAlign='center';sg.fillText(c.name.toLowerCase(),p[0],p[1]-9*DPR);}}
    if(performance.now()>lineUntil){const here=inFrame(w);$('frameline').textContent=here.length?here.map(c=>'town / '+siteNear(w,llDir(c.pos)[0]*R2D)+' / '+c.name.toLowerCase()+' · '+c.clip).join('   '):'';$('frameline').classList.toggle('on',here.length>0);}

  if(V.view==='PAGE')renderPage(stage,'road');else if(V.view==='ORB'&&V.renderer==='DOTS')drawDots(w.frame);else renderTo(stage,V.view,w.frame);
  if(V.view==='ORB'||V.view==='VIEW'){const O=observer(V.view,SW,SH);for(const c of w.citizens){if(!c.pos)continue;const v=O.to3(c.pos);if(v[2]<=O.eps)continue;const p=O.proj(v);sg.strokeStyle='#ff2e2e';sg.lineWidth=Math.max(1,DPR);sg.beginPath();sg.arc(p[0],p[1],7*DPR,0,TAU);sg.stroke();sg.fillStyle='#000';sg.font=Math.round(10*DPR)+'px "IBM Plex Mono",monospace';sg.textAlign='center';sg.fillText(c.name,p[0],p[1]-11*DPR);}}
  sheetEl.textContent='TICK '+String(w.frame).padStart(4,'0')+' · '+w.name+' · '+w.citizens.length+' citizens · '+FRAME.marks.length+' marks\n'+w.citizens.map(c=>{const lf=localFrame(c,w.frame);return c.name+' · '+c.clip+' f'+String(lf.f).padStart(3,'0')+' · at '+siteNear(w,c.pos?llDir(c.pos)[0]*R2D:c.lon)+' · '+c.memory.length+' memories';}).join('\n');
  frOut.textContent='t'+String(w.frame).padStart(4,'0')+' / '+FRAMES_WORLD;scrub.value=w.frame;curMark.style.left=(w.frame/(FRAMES_WORLD-1)*100)+'%';
  if(ledgerDirty){ledgerDirty=false;$('ledger').textContent=w.ledger.length?w.ledger.slice(-6).map(l=>'TICK '+String(l.f).padStart(4,'0')+'  '+l.text+'  ·  '+l.rel).join('\n'):'no encounters yet';}}
function enter(c){MODE='PERSON';ENTERED=c;mount(c.person);setPlaying(true);V.view='VIEW';V.cam.yaw=0;V.cam.pitch=-6*D2R;$('leave').hidden=false;$('leave').textContent='LEAVE '+c.name;ttrace('inside '+c.name+' · '+(c.memory.length?c.memory.slice(-3).join(' · '):'no memories yet'));showRows();}
function leave(){MODE='WORLD';ENTERED=null;cart=WORLD().set;$('leave').hidden=true;$('name').textContent='COMMON ORB FIELD · '+WORLD().name+' · FORKS '+(WORLDS.length-1);scrub.max=FRAMES_WORLD-1;FRAME.key='';dirty=true;showRows();ttrace('the town');}
function fork(){const w=WORLD();const n={name:'fork '+WORLDS.length,set:w.set,frame:w.frame,citizens:w.citizens.map(c=>Object.assign({},c,{memory:c.memory.slice(),marks:null,key:'',pos:null})),ledger:w.ledger.slice(),contacts:Object.assign({},w.contacts)};WORLDS.push(n);WI=WORLDS.length-1;buildWorldRows();ttrace('forked at tick '+w.frame+' · this is '+n.name);}
function showRows(){const world=MODE==='WORLD';['shots','planes','winrow1','winrow2'].forEach(id=>{const e=$(id);if(e)e.hidden=world;});['citrow','ledger'].forEach(id=>{const e=$(id);if(e)e.hidden=!world;});}
function buildWorldRows(){const w=WORLD();const cr=$('citizens');cr.innerHTML='';for(const c of w.citizens){const b=document.createElement('button');b.textContent='ENTER '+c.name;b.onclick=()=>enter(c);cr.appendChild(b);}
  const ws=$('worlds');ws.innerHTML='';WORLDS.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;o.selected=i===WI;ws.appendChild(o);});
  $('name').textContent='COMMON ORB FIELD · '+w.name+' · FORKS '+(WORLDS.length-1);ledgerDirty=true;dirty=true;}

/* ================= THE GRID: every shell's graticule, all at once ================= */
/* From the centre every shell's equirectangular grid coincides; the multiplane
   is invisible. Move the camera and the grids separate by 1/d — that is what
   depth is. So the town breathes: a slow truck, never past the nearest shell,
   and GRID draws each shell's graticule in its own colour on that shell. */
const GRID={on:false,cache:new Map()};
const SHELL_COL=d=>d<=.8?'#ff2e2e':d<=1.2?'#ffd23f':d<=2?'#19e6c8':d<=4.5?'#3b82f6':'#000';
function gridMarks(d){let ms=GRID.cache.get(d);if(ms)return ms;ms=[];const col=SHELL_COL(d);
  for(let lat=-75;lat<=75;lat+=15){const dirs=[];for(let lon=-180;lon<=180;lon+=2)dirs.push(dirLL(lon*D2R,lat*D2R));ms.push({kind:'ARC',dirs,w:lat===0?.5:.25,col,alpha:.55,shell:d,grid:true});}
  for(let lon=-180;lon<180;lon+=15){const dirs=[];for(let lat=-88;lat<=88;lat+=2)dirs.push(dirLL(lon*D2R,lat*D2R));ms.push({kind:'ARC',dirs,w:lon===0?.5:.25,col,alpha:.55,shell:d,grid:true});}
  GRID.cache.set(d,ms);return ms;}
function withGrid(marks){if(!GRID.on)return marks;const shells=[...new Set(marks.filter(m=>!m.parent).map(m=>m.shell))];const out=marks.slice();for(const d of shells)for(const g of gridMarks(d))out.push(g);return out;}
function townCam(wf){const dm=dmin();const amp=Math.min(.16,(WORLD().citizens.length?Math.min(...WORLD().citizens.map(c=>c.d)):1)*.28);return [amp*Math.sin(wf/95),amp*.4*Math.sin(wf/140+1),amp*.6*Math.sin(wf/210)];}
function dmin(){const w=WORLD();let d=cart?Math.min(...cart.planes.map(p=>p.d)):1;for(const c of w.citizens)d=Math.min(d,c.d);return d;}

/* ================= THE INTRO: the planet first, slowly ================= */
/* Opens on the ball from outside, turning, the animals small on its skin.
   Then the ball grows until it is around you, and you are at the market.
   Any touch skips it. Ceilings: 7 s turning, 3 s descent, 2 s settling. */
const INTRO={on:true,t0:0,T_TURN:11000,T_DOWN:3200,T_SETTLE:2000};   /* one full turn of the planet, slowly, ending on the market; then down */
V.ballScale=1;
function introFrame(now){if(!INTRO.on)return false;if(!INTRO.t0)INTRO.t0=now;const t=now-INTRO.t0,w=WORLD();
  if(t<INTRO.T_TURN){V.view='ORB';const u=t/INTRO.T_TURN;V.yaw=50*D2R+u*u*(3-2*u)*TAU;V.pitch=-14*D2R;V.ballScale=1;
    const names=w.citizens.map(c=>c.name.toLowerCase());const i=Math.floor(t/1800);
    if(performance.now()>lineUntil)say(i===0?'COMMON ORB FIELD':i===1?names.length+' animals · one world':names.slice(0,i-1).join(' · '),1500);return true;}
  if(t<INTRO.T_TURN+INTRO.T_DOWN){const u=(t-INTRO.T_TURN)/INTRO.T_DOWN,e=u*u*(3-2*u);V.view='ORB';V.yaw=50*D2R;V.pitch=-14*D2R*(1-e);V.ballScale=1+e*2.4;if(performance.now()>lineUntil)say('down',1200);return true;}
  if(t<INTRO.T_TURN+INTRO.T_DOWN+INTRO.T_SETTLE){const u=(t-INTRO.T_TURN-INTRO.T_DOWN)/INTRO.T_SETTLE;V.view='VIEW';V.cam.yaw=50*D2R;V.cam.pitch=-8*D2R;V.cam.fov=(118-36*u)*D2R;V.ballScale=1;return true;}
  INTRO.on=false;V.view='VIEW';V.cam.fov=82*D2R;V.ballScale=1;say('town / market  ·  drag to look  ·  pinch in on an animal to be where it is  ·  hold to peek at the ball',6000);return false;}
function skipIntro(){if(!INTRO.on)return;INTRO.on=false;V.view='VIEW';V.cam.yaw=50*D2R;V.cam.pitch=-8*D2R;V.cam.fov=82*D2R;V.ballScale=1;lineUntil=0;say('town / market',2000);}

/* ================= SCALE: one world, no doors ================= */
/* A citizen's interior is what the citizen is when you are close enough.
   DESCEND: pinch in until the frame is narrow and an animal is in front of
   you; its shells become your surround, the town is re-charted far away as
   its sky, in the directions you left it. ASCEND: pinch out past wide; the
   store shrinks back into the animal at the market. The parent holds while
   you are inside. Every mark carries an address in the one inscription.
   Ceilings: DESCEND at fov ≤ 42° with a figure within 14°; ASCEND at fov ≥ 112°;
   parent shell d=12; nesting ≤ 4 (the town, an animal, what it holds, once more). */
const FOV_DESCEND=42*D2R,FOV_ASCEND=112*D2R,NEAR=14*D2R,PARENT_D=12,NEST_MAX=4;
let PARENTS=[];   /* the stack of surrounds you came from: {marks, cit, yaw, fov, address} */
const address=()=>['town'].concat(PARENTS.map(p=>p.cit.name.toLowerCase())).join(' / ');
function descend(c){if(PARENTS.length>=NEST_MAX){say('this is as far in as the world goes',3000);return;}
  const yaw=V.cam.yaw,fov=V.cam.fov,up=[0,1,0];
  const far=FRAME.marks.map(m=>{const o=Object.assign({},m,{shell:PARENT_D,life:{f0:0,to:null},parent:true,alpha:PARENT_ALPHA*(m.alpha==null?1:m.alpha)});
    if(m.dirs)o.dirs=m.dirs.map(d=>rotAx(d,up,-yaw));if(m.rings)o.rings=m.rings.map(r=>r.map(d=>rotAx(d,up,-yaw)));if(m.p)o.p=rotAx(m.p,up,-yaw);return o;});
  PARENTS.push({marks:far,cit:c,yaw,fov,address:address()});
  enter(c);V.cam.yaw=0;V.cam.pitch=-6*D2R;V.cam.fov=100*D2R;lineUntil=0;say(address()+'  ·  pinch out to come back',3500);}
function ascend(){const p=PARENTS.pop();if(!p)return;
  if(PARENTS.length){const q=PARENTS[PARENTS.length-1];enter(q.cit);}else leave();
  V.view='VIEW';V.cam.yaw=p.yaw;V.cam.fov=Math.min(p.fov*1.15,60*D2R);V.cam.pitch=-8*D2R;lineUntil=0;say(address(),2500);dirty=true;}
function scaleCheck(){const f=V.cam.fov;
  if(MODE==='WORLD'&&f<=FOV_DESCEND){const look=dirLL(V.cam.yaw,V.cam.pitch);let best=null,bd=NEAR;for(const c of WORLD().citizens){if(!c.pos)continue;const a=ang(look,c.pos);if(a<bd){bd=a;best=c;}}if(best)descend(best);}
  else if(MODE==='PERSON'&&PARENTS.length&&f>=FOV_ASCEND)ascend();}
const parentMarks=()=>PARENTS.length?PARENTS[PARENTS.length-1].marks:[];
/* the parent shows through the interior, faint, drawn last: the town holding while you are inside */
const PARENT_ALPHA=.22;

/* ================= THE FRAME: one site at a time, from inside ================= */
/* The viewer stands in the town. What is out of frame reaches them at the
   edge (a mark at its bearing), by ear (a tap panned from where it happened)
   and as one line at the bottom. No labels on the ball, no rows. */
let FRAMECHROME=true,peek=false,lineUntil=0;
function say(text,ms){$('frameline').textContent=text;$('frameline').classList.add('on');lineUntil=performance.now()+(ms||3500);}
function edgeMarks(w){edgeMarksList(w.citizens);}

const EBML={SEGMENT:[0x18,0x53,0x80,0x67],TRACKS:[0x16,0x54,0xAE,0x6B],
  ENTRY:[0xAE],VIDEO:[0xE0],PROJECTION:[0x76,0x70],PROJTYPE:[0x76,0x71]};
function vintLen(b){                        // how many bytes this VINT occupies
  for(let i=0;i<8;i++)if(b&(0x80>>i))return i+1;
  return 0;}
function readSize(buf,i){
  const n=vintLen(buf[i]);
  if(!n)return null;
  let v=buf[i]&(0xFF>>n),all=(0xFF>>n)===v;
  for(let k=1;k<n;k++){v=v*256+buf[i+k];if(buf[i+k]!==0xFF)all=false;}
  return {size:v,len:n,unknown:all};}
function size8(v){                           // always eight bytes: always legal
  const out=new Uint8Array(8);out[0]=0x01;
  for(let i=7;i>=1;i--){out[i]=v%256;v=Math.floor(v/256);}
  return out;}
const idAt=(buf,i,id)=>id.every((b,k)=>buf[i+k]===b);
/* the first child with this id, within [from,to) */
function findChild(buf,from,to,id){
  let i=from,guard=0;
  while(i<to&&guard++<4096){
    const idLen=vintLen(buf[i]);
    if(!idLen)return null;
    const sz=readSize(buf,i+idLen);
    if(!sz)return null;
    const dataStart=i+idLen+sz.len;
    const dataEnd=sz.unknown?to:dataStart+sz.size;
    if(idAt(buf,i,id))return {idStart:i,idLen,dataStart,dataEnd,unknown:sz.unknown};
    if(dataEnd<=i||dataEnd>to)return null;
    i=dataEnd;}
  return null;}
const cat=parts=>{
  let n=0;for(const p of parts)n+=p.length;
  const out=new Uint8Array(n);let o=0;
  for(const p of parts){out.set(p,o);o+=p.length;}
  return out;};
function projectionBytes(){
  const type=cat([new Uint8Array(EBML.PROJTYPE),size8(1),new Uint8Array([1])]);
  return cat([new Uint8Array(EBML.PROJECTION),size8(type.length),type]);}
function wrapEl(id,data){

  if(!tracks||tracks.unknown)return null;

  if(!entry)return null;

  if(!video)return null;
  if(findChild(buf,video.dataStart,video.dataEnd,EBML.PROJECTION))return buf; // already said

    buf.subarray(video.dataEnd,entry.dataEnd)]);
  const newEntry=wrapEl(EBML.ENTRY,entryData);

/* ======================================================================
   CARTOON · PELICAN RIDES A BICYCLE
   Formed from nothing, straight onto shells. There was never a flat film.

   THE FORMING, as it happened (the author's x-sheet, kept)
   0 nothing        a ball, a centre, 24 frames a second.
   1 premise        a pelican rides a bicycle. Around whom? Around you.
                    So the road is a ring, and the audience turns to follow.
   2 world          concentric drums, far to near:
                      SKY   cap at the zenith, d=6  (sun, two clouds)
                      SEA   band at the horizon, d=5 (waves drift)
                      SAND  cap at the nadir, d=1.5  (the ground under you)
                      ROAD  band, d=1.5              (two lines, a full ring)
                      PELICAN band, d=1              (the act)
                      POSTS band, d=.6               (railing, one gull)
                    the page is the drum: 1440 px = 360°, 4 px a degree.
   3 cast           pelican (pouch, one fish), bicycle (two wheels, a bell),
                    gull (turns its head), the fish (flops once).
   4 staging        enters behind you (lon 180), rides a lap anticlockwise,
                    loses the fish at lon −60, skids, looks back, reverses,
                    scoops it, rides on, rings the bell passing the front,
                    exits behind. One shot. Then a placard.
   5 keys           K01 enter · K02 wobble · K03 fish flops · K04 skid ·
                    K05 look back · K06 reverse · K07 scoop · K08 bell ·
                    K09 exit  — breakdowns between, on twos.
   6 camera         no pan (there is no camera to pan; the audience turns).
                    one slow dolly in, so the near posts drift: the shells show.
   7 sound          every cue has a place on the drum, so VIEW pans it.
   8 look/compare   drawn in the harness at f 0/40/96/120/160/190/230/287,
                    ball, inside, sheet, page. Best kept.
   ====================================================================== */

  if(vis[1])plane('fence',cam,()=>{const q=rng(11);for(let x=-100;x<W+100;x+=150)ink([{x,y:Y(-9)},{x:x+1,y:Y(-4)}],q,{w:2,jit:.6,stroke:nt?'#0f1218':INK});ink([{x:-100,y:Y(-6)},{x:W+100,y:Y(-6)}],q,{w:1.4,jit:.5,stroke:nt?'#0f1218':INK});
    grassField(q,env,Y(-20),-100,W+100,26,1.2);});

return {name:'COMMON ORB FIELD',credit:'the town, with scent vector\'s weather',W,H,fps:24,twos:true,paper:'#d6d7cc',window:{size:360,lon:0,lat:0},truck:0,

/* --- GULL ON A POST · stays at the shore, looks, flaps once ------------- */
ORB.register(function(ST){
const {rng,ink,ell,arc,rect,makeShot,plane,o,n}=ST;
const W=360,H=240;ST.inkColour='#151515';
const post={x:180,y:150};
function gull(g,r){const x=post.x,y=post.y;ink([{x:x-3,y:y+40},{x:x-3,y}],r,{w:2,stroke:'#5a4d3a'});ink([{x:x+3,y:y+40},{x:x+3,y}],r,{w:2,stroke:'#5a4d3a'});
  const fl=g.flap;ink(ell(x,y-13,13,9),r,{fill:'#f4f4f4',closed:true,w:1.4});
  ink([{x:x-4,y:y-16},{x:x-18,y:y-16-fl*22},{x:x-26,y:y-10-fl*14}],r,{w:1.4,fill:'#e8e8e8',closed:true});      // near wing
  const hx=x+g.look*12,hy=y-29-g.up*6;ink([{x:x+3,y:y-20},{x:hx,y:hy+6}],r,{w:5,stroke:'#f4f4f4'});
  ink(ell(hx,hy,7,7),r,{fill:'#f4f4f4',closed:true,w:1.4});const s=g.look>=0?1:-1;
  ink([{x:hx+5*s,y:hy},{x:hx+15*s,y:hy+2},{x:hx+5*s,y:hy+3}],r,{fill:'#e8b04c',closed:true,w:1.1});ink(ell(hx+2*s,hy-2,1.4,1.4),r,{fill:'#151515',closed:true,stroke:false});}
const S=makeShot('SHOT 01 — the post',144,{g:{look:1,flap:0,up:0},fish:{t:0}});
const k=(f,c,l,p)=>S.key(f,c,l,p);
k(0,'K01','looks right');k(30,'B','',{g:{look:.2}});k(40,'K02','looks left',{g:{look:-1}});k(70,'H','hold');k(84,'B','',{g:{look:0,up:1}});
k(96,'K03','flaps',{g:{flap:1,up:1}});k(104,'B','',{g:{flap:0}});k(112,'B','',{g:{flap:1}});k(120,'B','',{g:{flap:0,up:0}});k(143,'K04','settles',{g:{look:1}});
S.sfx(96,'squawk',[post.x,post.y-30]);S.sfx(40,'tick',[post.x,post.y-30]);S.cam(0,W/2,H/2,1);
S.draw=(s,cam,r,vis)=>{
  if(vis[2])plane('sky',cam,()=>{const q=rng(2);ST.ctx.fillStyle='#e3edf3';ST.ctx.fillRect(-3000,-3000,7000,7000);for(let i=0;i<5;i++)for(let j=0;j<3;j++)ink(ell(W/2+(i-2)*70+j*20,H/2+(i%2)*40+(j%2)*8,16,10),q,{fill:'#fff',closed:true,w:1.1,jit:.9});});
  if(vis[1])plane('sea',cam,()=>{const q=rng(3);ST.ctx.fillStyle='#a9c9d9';ST.ctx.fillRect(-500,H*.62,1400,300);ink([{x:-500,y:H*.62},{x:900,y:H*.62}],q,{w:1.2});
    for(let i=0;i<20;i++)ink(arc(-400+i*70+(s.fish.t*30)%70,H*.62+16+(i%3)*9,7,Math.PI*1.15,Math.PI*1.85,6),q,{w:1,jit:.5,stroke:'#5f8ea3'})});
  if(vis[0])plane('gull',cam,()=>{gull(s.g,r())});};
return {name:'GULL ON A POST',credit:'stays',W,H,fps:24,twos:true,paper:'#e3edf3',window:{size:100,lon:0,lat:6},truck:0,
  planes:[{label:'gull',d:1,chart:'TANGENT'},{label:'sea',d:5,chart:'BAND'},{label:'sky',d:6,chart:'CAP',lat:90,size:80}],
  shots:[S],SFX:{squawk:()=>{o('triangle',850,1300,.09,.1,0,{lp:[2400,1400]});o('triangle',1300,650,.13,.1,.09,{lp:[2400,900]})},tick:()=>o('sine',900,700,.04,.12)},
  person:{figure:['gull'],clips:{look:[0,0,95],flap:[0,96,143]},where:s=>[post.x,post.y-20],stays:true}};
});

/* --- SNAIL GOES HOME · slow clock, a trail, a spiral inside ---------------- */
ORB.register(function(ST){
const {rng,ink,ell,arc,makeShot,plane,o,n}=ST;
const W=360,H=240;ST.inkColour='#151515';const GY=170;
function snail(p,r){ST.ctx.save();ST.ctx.translate(p.x,GY);const sq=p.sq;
  ink([{x:-60,y:2},{x:0,y:2}],r,{w:3,stroke:'#cfd8c4',jit:.6});                                    // the trail
  ink(ell(-8,-8,20*sq,10/sq),r,{fill:'#d8c690',closed:true,w:1.4});                                 // foot
  ink(ell(-12,-24,17,15),r,{fill:'#c98a4b',closed:true,w:1.5});                                     // shell
  for(let i=1;i<4;i++)ink(arc(-12,-24,i*4.5,0,Math.PI*1.6+i*.4,12),r,{w:1.1,jit:.3});                // the spiral
  const hx=14+p.reach*10,hy=-14;ink([{x:4,y:-8},{x:hx,y:hy}],r,{w:6,stroke:'#d8c690'});ink(ell(hx,hy,6,5),r,{fill:'#d8c690',closed:true,w:1.3});
  [[-2,1],[3,-1]].forEach(([dx,dd])=>{ink([{x:hx+dx,y:hy-4},{x:hx+dx+dd*3,y:hy-16}],r,{w:1.4});ink(ell(hx+dx+dd*3,hy-17,1.8,1.8),r,{fill:'#151515',closed:true,stroke:false});});
  ST.ctx.restore();}
const S=makeShot('SHOT 01 — the long way',192,{s:{x:120,sq:1,reach:0}});
const k=(f,c,l,p)=>S.key(f,c,l,p);
k(0,'K01','sets out');k(24,'B','',{s:{x:126,sq:1.15}});k(48,'B','',{s:{x:140,sq:.9,reach:1}});k(72,'K02','stretches',{s:{x:150,sq:1.1,reach:0}});
k(96,'B','',{s:{x:164,sq:.9,reach:1}});k(120,'B','',{s:{x:176,sq:1.1,reach:0}});k(144,'K03','looks up',{s:{x:186,sq:1,reach:.6}});k(191,'H','hold');
S.sfx(48,'slide',[150,GY]);S.sfx(144,'slide',[186,GY]);S.cam(0,W/2,H/2,1);
S.draw=(s,cam,r,vis)=>{
  if(vis[1])plane('shell',cam,()=>{const q=rng(5);ST.ctx.fillStyle='#e9d3a8';ST.ctx.fillRect(-500,-300,1400,600);   /* inside the shell: a band that spirals */
    for(let i=0;i<9;i++)ink([{x:-500,y:-260+i*60},{x:900,y:-220+i*60}],q,{w:1.4,jit:.6,stroke:'#b3773f'});
    for(let i=0;i<7;i++)ink(arc(180,100,20+i*22,0,Math.PI*1.7,20),q,{w:1.6,jit:.5,stroke:'#b3773f'});});
  if(vis[0])plane('snail',cam,()=>{snail(s.s,r())});};
return {name:'SNAIL GOES HOME',credit:'slowly',W,H,fps:24,twos:true,paper:'#e9d3a8',window:{size:100,lon:0,lat:4},truck:0,
  planes:[{label:'snail',d:1,chart:'TANGENT'},{label:'shell',d:3,chart:'BAND'}],
  shots:[S],SFX:{slide:()=>n(.25,.08,0,'lowpass',500)},
  person:{figure:['snail'],clips:{crawl:[0,0,191]},where:s=>[s.s.x,GY-10]}};
});

/* --- DOG DIGS · at the school, a hole, a bone ------------------------------ */
ORB.register(function(ST){
const {rng,ink,ell,arc,rect,makeShot,plane,o,n}=ST;
const W=360,H=240;ST.inkColour='#151515';const GY=172;
function dog(p,r){ST.ctx.save();ST.ctx.translate(p.x,GY);
  ink(ell(0,-2,26+p.dig*8,7),r,{fill:'#6b5537',closed:true,w:1.2,jit:.8});                             // the hole
  ST.ctx.rotate(-p.dig*.5);
  ink(ell(-6,-26,24,14),r,{fill:'#e0b26b',closed:true,w:1.5});                                          // body
  ink([{x:-28,y:-30},{x:-40,y:-44-p.tail*8}],r,{w:3,stroke:'#e0b26b'});                                  // tail
  [[-14,4],[-4,6],[6,4],[14,6]].forEach(([dx,dy],i)=>ink([{x:dx,y:-16},{x:dx+(i>1?p.dig*10:0),y:dy-p.dig*(i>1?10:0)}],r,{w:3.5,stroke:'#e0b26b'}));
  const hx=16+p.dig*6,hy=-38+p.dig*14;ink(ell(hx,hy,11,9),r,{fill:'#e0b26b',closed:true,w:1.5});
  ink(ell(hx-4,hy-8,4,7,-.4),r,{fill:'#c4924e',closed:true,w:1.2});ink(ell(hx+10,hy+3,2.6,2,0),r,{fill:'#151515',closed:true,stroke:false});ink(ell(hx+3,hy-2,1.4,1.4),r,{fill:'#151515',closed:true,stroke:false});
  if(p.bone>.5){ink([{x:hx+6,y:hy+8},{x:hx+22,y:hy+8}],r,{w:3,stroke:'#fff'});[hx+6,hx+22].forEach(x=>ink(ell(x,hy+8,3,3),r,{fill:'#fff',closed:true,w:1}));}
  ST.ctx.restore();for(let i=0;i<4;i++)if(p.dig>.6)ink(ell(p.x-30-i*9,GY-20-i*8-p.dig*10,3,2),r,{fill:'#6b5537',closed:true,w:.8});}
const S=makeShot('SHOT 01 — the hole',168,{d:{x:180,dig:0,tail:0,bone:0}});
const k=(f,c,l,p)=>S.key(f,c,l,p);
k(0,'K01','sniffs');k(20,'B','',{d:{tail:1}});k(32,'K02','digs',{d:{dig:1,tail:1}});k(40,'B','',{d:{dig:.4}});k(48,'B','',{d:{dig:1}});k(56,'B','',{d:{dig:.4}});k(64,'B','',{d:{dig:1}});
k(80,'K03','finds it',{d:{dig:.2,bone:1,tail:1}});k(96,'B','',{d:{tail:0}});k(104,'B','',{d:{tail:1}});k(112,'B','',{d:{tail:0}});k(140,'K04','trots',{d:{x:220,dig:0,tail:1}});k(167,'H','hold');
S.sfx(32,'scratch',[180,GY]);S.sfx(48,'scratch',[180,GY]);S.sfx(64,'scratch',[180,GY]);S.sfx(80,'woof',[190,GY-30]);S.cam(0,W/2,H/2,1);
S.draw=(s,cam,r,vis)=>{
  if(vis[2])plane('yard',cam,()=>{const q=rng(4);ST.ctx.fillStyle='#d7e0c6';ST.ctx.fillRect(-500,-300,1400,600);ink([{x:-500,y:GY+4},{x:900,y:GY+4}],q,{w:1.3});
    for(let i=0;i<12;i++){const x=-400+i*110;ink([{x,y:GY},{x,y:GY-50}],q,{w:1.6,stroke:'#5a4d3a'});}ink([{x:-500,y:GY-40},{x:900,y:GY-40}],q,{w:1.6,stroke:'#5a4d3a'});});
  if(vis[1])plane('under',cam,()=>{const q=rng(6);ST.ctx.fillStyle='#4a3826';ST.ctx.fillRect(-3000,-3000,7000,7000);for(let i=0;i<18;i++){const a=i*1.1,rr=40+(i*61)%260;ink([{x:W/2+Math.cos(a)*rr,y:H/2+Math.sin(a)*rr},{x:W/2+Math.cos(a+.4)*(rr+50),y:H/2+Math.sin(a+.4)*(rr+50)}],q,{w:1.8,jit:.8,stroke:'#8a6a45'})}});
  if(vis[0])plane('dog',cam,()=>{dog(s.d,r())});};
return {name:'DOG DIGS',credit:'at the school',W,H,fps:24,twos:true,paper:'#d7e0c6',window:{size:100,lon:0,lat:4},truck:0,
  planes:[{label:'dog',d:1,chart:'TANGENT'},{label:'under',d:1.5,chart:'CAP',lat:-90,size:60},{label:'yard',d:4,chart:'BAND'}],
  shots:[S],SFX:{scratch:()=>{n(.12,.14,0,'bandpass',1800,3);n(.12,.1,.13,'bandpass',1500,3)},woof:()=>{o('sawtooth',220,150,.12,.14,0,{lp:[1200,500]});o('sawtooth',260,170,.1,.12,.14,{lp:[1200,500]})}},
  person:{figure:['dog'],clips:{dig:[0,0,139],trot:[0,140,167]},where:s=>[s.d.x,GY-20]}};
});

/* the town, with its first two citizens */
try{const town=ORB.cartoons.find(c=>c.sites),frog=ORB.cartoons.find(c=>c.name==='FROG GETS GROCERIES'),pel=ORB.cartoons.find(c=>c.name==='PELICAN RIDES A BICYCLE');
 if(!town||!frog||!pel)throw new Error('a citizen did not register: '+ORB.cartoons.map(c=>c.name).join(', '));
 const w=makeWorld('the town',town);WORLDS.push(w);
 addCitizen(w,{name:'FROG',person:frog,lon:50,lat:-14,d:1,scale:.38,clock:1,clip:'browse',drift:6});
