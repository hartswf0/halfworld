<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>EVERYBODY — pristine body-field dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--paper:#fff;--teal:#19d8c1;--red:#ff2e2e;--soft:rgba(0,0,0,.16);--joy:min(30vw,220px)}
*{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',monospace;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;top:0;left:0;right:0;height:38px;z-index:40;display:flex;align-items:stretch;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(0,0,0,.25);backdrop-filter:blur(5px)}
#mark{width:38px;display:grid;place-items:center;border-right:1px solid rgba(0,0,0,.22)}
#mark i{width:12px;height:12px;border:2px solid #000;position:relative}#mark i:after{content:"";position:absolute;width:3px;height:3px;background:var(--teal);left:50%;top:50%;transform:translate(-50%,-50%)}
#word{flex:1;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:1.7px;white-space:nowrap}
#loads{width:58px;display:flex;gap:5px;align-items:center;padding:0 8px}
.load{height:2px;flex:1;background:rgba(0,0,0,.12);overflow:hidden}.load i{display:block;width:100%;height:100%;background:var(--teal);transform:scaleX(.05);transform-origin:left center}
.bbtn{width:38px;height:100%;padding:0;border:0;border-left:1px solid rgba(0,0,0,.22);background:transparent;color:#000;font:700 17px/1 'IBM Plex Mono',monospace;display:grid;place-items:center}.bbtn:active,.bbtn.on{background:#000;color:#fff}.bbtn.live{background:var(--red);color:#fff}#exportBtn{background:#000;color:#fff}
#styleName{display:none}
#thumbdeck{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));height:calc(var(--joy) + 8px);z-index:50;pointer-events:none}
.joy{position:absolute;bottom:0;width:var(--joy);height:var(--joy);border:1.25px solid rgba(0,0,0,.72);border-radius:50%!important;background:rgba(255,255,255,.72);pointer-events:auto;touch-action:none;backdrop-filter:blur(3px);will-change:transform;z-index:2}
#joyL{left:max(12px,env(safe-area-inset-left))}#joyR{right:max(12px,env(safe-area-inset-right))}.macroHome{position:absolute;bottom:0;width:var(--joy);height:var(--joy);border:1px dashed rgba(0,0,0,.12);border-radius:50%!important;transform:scale(1.62);pointer-events:none;z-index:0}.macroHome:after{content:"";position:absolute;inset:31%;border:1px solid rgba(25,216,193,.10);border-radius:50%!important}#macroHomeL{left:max(12px,env(safe-area-inset-left))}#macroHomeR{right:max(12px,env(safe-area-inset-right))}.joy.macro{border-color:var(--teal);box-shadow:0 0 0 2px rgba(25,216,193,.10)}.joy.step{box-shadow:inset 0 0 0 3px rgba(25,216,193,.16)}.joy.step .inner{border-color:rgba(25,216,193,.55)}
.joy:before,.joy:after{content:"";position:absolute;background:rgba(0,0,0,.13);pointer-events:none}.joy:before{left:50%;top:10%;bottom:10%;width:1px}.joy:after{top:50%;left:10%;right:10%;height:1px}
.joy .inner{position:absolute;inset:26%;border:1px solid rgba(0,0,0,.16);border-radius:50%!important;pointer-events:none}
/* JOYSTICK OF JOYSTICKS: the inner field is distal (hand/wrist).
   The outer annulus drives a retained proximal vector (shoulder/body support). */
.joy .supportRing{position:absolute;inset:7%;border:1px dashed rgba(0,0,0,.18);border-radius:50%!important;pointer-events:none}
.joy .supportRing:after{content:"";position:absolute;inset:16%;border:1px solid rgba(0,0,0,.07);border-radius:50%!important}
.joy .supportPuck{position:absolute;left:50%;top:50%;width:17%;height:17%;transform:translate(-50%,-50%);border:1.5px solid var(--teal);border-radius:50%!important;background:rgba(255,255,255,.72);pointer-events:none;box-shadow:0 0 0 2px rgba(25,216,193,.08)}
.joy .supportPuck:after{content:"";position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);background:var(--teal);border-radius:50%!important}
.joy.supporting .supportRing{border-color:rgba(25,216,193,.72)}
.joy.supporting{box-shadow:inset 0 0 0 3px rgba(25,216,193,.09)}
/* The crescent is the body's frontal shoulder plane. Crossing it with the
   thumb changes the same surface from lateral placement into depth. */
.joy .gate{position:absolute;top:16%;bottom:16%;width:31%;pointer-events:none;opacity:.58;transition:opacity .08s}
#joyL .gate{right:8%;border-left:1.5px solid rgba(0,0,0,.72);border-radius:50% 0 0 50%!important}
#joyR .gate{left:8%;border-right:1.5px solid rgba(0,0,0,.72);border-radius:0 50% 50% 0!important}
.joy.front .gate{border-color:var(--teal);opacity:1}
.joy .depthhalo{position:absolute;left:50%;top:50%;width:48%;height:48%;transform:translate(-50%,-50%) scale(calc(.82 + var(--front,0)*.72));border:1px solid var(--teal);border-radius:50%!important;opacity:calc(var(--front,0)*.64);pointer-events:none}
.joy .bendmark{position:absolute;left:50%;top:50%;width:11%;height:11%;transform:translate(-50%,-50%) scale(calc(.75 + var(--bend,0)*1.5));background:rgba(25,216,193,.16);border-radius:50%!important;opacity:calc(var(--bend,0)*.9);pointer-events:none}
.joy .puck{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border:1.5px solid #000;border-radius:50%!important;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.10);pointer-events:none}
.joy .puck:after{content:"";position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%!important;background:#111}
.joy .ghost{position:absolute;left:50%;top:50%;width:12%;height:12%;transform:translate(-50%,-50%);border:1.5px solid var(--teal);border-radius:50%!important;pointer-events:none;opacity:.9;box-shadow:0 0 0 3px rgba(25,216,193,.10)}
.joy .ghost:after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);background:var(--teal);border-radius:50%!important}
body.no-teacher .joy .ghost{opacity:0}
.joy.active{border-color:#000}.joy.active .puck{box-shadow:0 0 0 3px rgba(25,216,193,.22)}.joy.active .puck:after{background:var(--teal)}
#quick{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,34px);grid-auto-rows:34px;gap:5px;pointer-events:auto}
.q{border:1px solid rgba(0,0,0,.36);background:rgba(255,255,255,.86);color:#000;font:700 16px/1 'IBM Plex Mono',monospace;touch-action:manipulation}.q.active{background:#000;color:#fff;border-color:#000}.q.active:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%!important;background:var(--teal);margin:10px 0 0 -2px}.q:active{background:#000;color:#fff}.q.red{color:var(--red)}
#polemini{position:absolute;left:50%;bottom:108px;width:78px;height:35px;transform:translateX(-50%);pointer-events:none;opacity:.72}
#polemini:before{content:"";position:absolute;left:8px;right:8px;top:8px;height:2px;background:#000;transform:rotate(var(--mini-roll,0deg));transform-origin:50% 50%}
#polemini:after{content:"";position:absolute;left:50%;top:8px;width:2px;height:22px;background:#000;transform:translateX(-50%)}
#polemini i{position:absolute;top:4px;width:10px;height:10px;border:1.5px solid #000;border-radius:50%!important;background:#fff}#polemini i:first-child{left:4px}#polemini i:last-child{right:4px}#polemini.hot i{border-color:var(--teal)}
#stat,#chips,#legend{display:none!important}
#glfail{position:fixed;inset:38px 0 0;z-index:1000;background:#fff;padding:18px;display:none;overflow:auto}#glfail.show{display:block}#glfail h1{font-size:13px;letter-spacing:1px}#glfail p{font-size:11px;line-height:1.5;max-width:68ch}
.touchmark{position:fixed;width:28px;height:28px;margin:-14px 0 0 -14px;border:1.5px solid #000;border-radius:50%!important;z-index:100;pointer-events:none;display:none}.touchmark:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;background:var(--teal);transform:translate(-50%,-50%);border-radius:50%!important}
@media(max-width:720px){:root{--joy:min(35vw,190px)}#word{font-size:10px}.bbtn{width:34px}#loads{width:46px;padding:0 6px}.q{width:32px;height:32px}#quick{grid-template-columns:repeat(4,32px);grid-auto-rows:32px;gap:4px}#polemini{bottom:91px}}
@media(orientation:portrait){:root{--joy:min(40vw,220px)}#thumbdeck{height:calc(var(--joy) + 14px)}#polemini{bottom:calc(var(--joy) * .58)}#quick{bottom:18px}}

/* performance tuning: intentionally hidden until requested */
#tuneBtn{font-size:15px}
#tuner{position:fixed;top:38px;right:0;z-index:70;width:min(228px,58vw);padding:8px 9px 9px;background:rgba(255,255,255,.94);border-left:1px solid rgba(0,0,0,.22);border-bottom:1px solid rgba(0,0,0,.22);backdrop-filter:blur(7px);display:none;touch-action:none}
#tuner.on{display:block}
.trow{height:26px;display:grid;grid-template-columns:18px 1fr 34px;align-items:center;gap:6px}
.trow b{font-size:10px;letter-spacing:0;text-align:center}.trow output{font-size:9px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.trow input{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;touch-action:none}
.trow input::-webkit-slider-runnable-track{height:2px;background:rgba(0,0,0,.20)}
.trow input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5.5px;border:1.5px solid #000;border-radius:50%!important;background:#fff}
.trow input::-moz-range-track{height:2px;background:rgba(0,0,0,.20)}
.trow input::-moz-range-thumb{width:11px;height:11px;border:1.5px solid #000;border-radius:50%!important;background:#fff}
#tuneFoot{height:27px;margin-top:5px;border-top:1px solid rgba(0,0,0,.16);display:flex;justify-content:flex-end;align-items:end;gap:5px}
.tmini{width:28px;height:22px;border:1px solid rgba(0,0,0,.30);background:#fff;font:700 12px/1 'IBM Plex Mono',monospace}.tmini:active{background:#000;color:#fff}
#feelDot{position:fixed;z-index:69;width:7px;height:7px;border-radius:50%!important;background:var(--teal);pointer-events:none;opacity:0;transform:translate(-50%,-50%)}
body.tuning #thumbdeck{opacity:.30}body.tuning #gl{filter:saturate(.85)}


/* TELEOPERATION DOJO ------------------------------------------------------ */
#dojorail{position:fixed;z-index:62;top:45px;left:50%;transform:translateX(-50%);display:flex;height:30px;max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none;background:rgba(255,255,255,.82);border:1px solid rgba(0,0,0,.18);backdrop-filter:blur(5px);pointer-events:auto}#dojorail::-webkit-scrollbar{display:none}
.dj{width:31px;height:29px;border:0;border-right:1px solid rgba(0,0,0,.15);background:transparent;color:#111;font:700 15px/1 'IBM Plex Mono',monospace;padding:0;touch-action:manipulation}.dj:last-child{border-right:0}.dj.on{background:#111;color:#fff}.dj.on:after{content:"";display:block;width:4px;height:4px;background:var(--teal);border-radius:50%!important;margin:-5px auto 0}.dj:active{background:#111;color:#fff}
#dojotag{position:fixed;z-index:61;top:78px;left:50%;transform:translateX(-50%);font:700 8px/1 'IBM Plex Mono',monospace;letter-spacing:1.6px;padding:3px 5px;background:rgba(255,255,255,.74);pointer-events:none;min-width:36px;text-align:center}#dojotag.done{color:#0a8f6f}#taskhint{position:fixed;z-index:61;top:91px;left:50%;transform:translateX(-50%);font:700 7px/1 'IBM Plex Mono',monospace;letter-spacing:1px;white-space:nowrap;opacity:.56;pointer-events:none}#taskhint.hot{color:#0a8f6f;opacity:1}
#dojogrip{position:fixed;z-index:61;top:46px;right:5px;width:7px;height:7px;border:1px solid rgba(0,0,0,.45);border-radius:50%!important;background:#fff;pointer-events:none}#dojogrip.on{background:var(--teal);border-color:var(--teal)}
@media(max-width:560px){#dojorail{top:42px}.dj{width:29px}#dojotag{top:74px}#taskhint{top:87px}}


/* top-swipe control rail: moves all mode/task buttons out of the play space */
#bar{gap:0;overflow:hidden}
#word{flex:0 0 auto;min-width:142px;max-width:45vw;overflow:hidden;text-overflow:ellipsis}
#controlsRail{flex:1;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity;background:transparent}
#controlsRail::-webkit-scrollbar{display:none}
#controlsRail .railSep{flex:0 0 8px;border-left:1px solid rgba(0,0,0,.12)}
#controlsRail .bbtn,#controlsRail .q,#controlsRail .dj{flex:0 0 38px;width:38px;height:100%;min-height:38px;display:grid;place-items:center;border:0;border-left:1px solid rgba(0,0,0,.22);background:transparent;color:#000;font:700 16px/1 'IBM Plex Mono',monospace;scroll-snap-align:start;position:relative}
#controlsRail .q,#controlsRail .dj{font-size:16px}
#controlsRail .q.active,#controlsRail .dj.on,#controlsRail .bbtn.on,#controlsRail .bbtn.live{background:#000;color:#fff;border-color:#000}
#controlsRail .q.active:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%!important;background:var(--teal);bottom:6px;left:50%;transform:translateX(-50%)}
#controlsRail .bbtn:active,#controlsRail .q:active,#controlsRail .dj:active{background:#000;color:#fff}
#controlsRail .bbtn#exportBtn{background:#000;color:#fff}
#controlsRail .bbtn#exportBtn:active{background:#000;color:#fff;filter:invert(1)}
#thumbdeck #quick{display:none!important}
#dojorail{display:none!important}
#dojotag{top:41px;background:rgba(255,255,255,.82);padding:2px 5px}
#taskhint{top:53px;background:rgba(255,255,255,.7);padding:2px 5px}
@media(max-width:720px){#word{min-width:118px;max-width:41vw}#controlsRail .bbtn,#controlsRail .q,#controlsRail .dj{flex-basis:34px;width:34px;min-height:38px;font-size:15px}}


/* PRISTINE STAGE -----------------------------------------------------------
   If it is not a control, it does not occupy the stage. Task language lives
   in the former brand slot; everything else is either the world or an input. */
#mark,#loads,#polemini,#dojotag,#taskhint,#dojogrip{display:none!important}
#bar{height:40px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.18)}
#word{flex:0 0 210px;min-width:210px;max-width:210px;padding:0 12px;font-size:10px;letter-spacing:1.15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid rgba(0,0,0,.16)}
#controlsRail{height:40px;touch-action:pan-x;overscroll-behavior-x:contain}
#controlsRail .bbtn,#controlsRail .q,#controlsRail .dj{height:40px;min-height:40px;flex-basis:42px;width:42px;touch-action:pan-x;border-left:0;border-right:1px solid rgba(0,0,0,.13)}
#controlsRail .railSep{flex-basis:6px;border-left:0;border-right:1px solid rgba(0,0,0,.16)}
#tuner{top:40px}
#glfail{inset:40px 0 0}
#thumbdeck{z-index:50}
@media(max-width:720px){#word{flex-basis:174px;min-width:174px;max-width:174px;font-size:9px;padding:0 9px}#controlsRail .bbtn,#controlsRail .q,#controlsRail .dj{flex-basis:38px;width:38px}}
@media(max-width:520px){#word{flex-basis:145px;min-width:145px;max-width:145px;font-size:8.5px;letter-spacing:.8px}#controlsRail .bbtn,#controlsRail .q,#controlsRail .dj{flex-basis:36px;width:36px}}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar">
  <div id="mark"><i></i></div>
  <div id="word">WALL · TOUCH · STAY</div>
  <div id="loads"><span class="load"><i id="loadL"></i></span><span class="load"><i id="loadR"></i></span></div>
  <div id="controlsRail" aria-label="top swipe controls"></div>
  <button class="bbtn" id="teachBtn" aria-label="teacher" title="teacher / auto pilot">▶</button>
  <button class="bbtn" id="captureBtn" aria-label="record" title="record">●</button>
  <button class="bbtn" id="styleBtn" aria-label="style" title="style">◐<b id="styleName">WHITE</b></button>
  <button class="bbtn" id="tuneBtn" aria-label="tune" title="tune">≋</button>
  <button class="bbtn" id="exportBtn" aria-label="export glb" title="export glb">↓</button>
</div>
<div id="tuner" aria-label="performance tuning">
  <div class="trow" title="body mass"><b>W</b><input data-tune="massKg" type="range" min="30" max="120" step="1"><output></output></div>
  <div class="trow" title="string tension / stiffness"><b>T</b><input data-tune="tension" type="range" min="0.08" max="0.85" step="0.01"><output></output></div>
  <div class="trow" title="joint limit strength"><b>J</b><input data-tune="joint" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="trow" title="self collision thickness"><b>C</b><input data-tune="collision" type="range" min="0.65" max="1.45" step="0.01"><output></output></div>
  <div class="trow" title="motion damping"><b>D</b><input data-tune="damping" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="trow" title="haptic intensity"><b>H</b><input data-tune="haptic" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="trow" title="thumb gain"><b>G</b><input data-tune="gain" type="range" min="0.30" max="1.15" step="0.01"><output></output></div>
  <div class="trow" title="thumb response curve"><b>E</b><input data-tune="expo" type="range" min="0" max="0.85" step="0.01"><output></output></div>
  <div class="trow" title="input smoothing"><b>S</b><input data-tune="smooth" type="range" min="0" max="0.90" step="0.01"><output></output></div>
  <div class="trow" title="whole-body expression coupling"><b>X</b><input data-tune="expression" type="range" min="0.40" max="1.80" step="0.01"><output></output></div>
  <div class="trow" title="shoulder-gate depth authority"><b>Z</b><input data-tune="depth" type="range" min="0.35" max="1.60" step="0.01"><output></output></div>
  <div class="trow" title="bend from pressure / rim load"><b>B</b><input data-tune="bend" type="range" min="0" max="1.35" step="0.01"><output></output></div>
  <div class="trow" title="overshoot recruits shoulder and torso"><b>R</b><input data-tune="recruit" type="range" min="0" max="1.35" step="0.01"><output></output></div>
  <div class="trow" title="object mass scale"><b>O</b><input data-tune="objectMass" type="range" min="0.35" max="2.20" step="0.01"><output></output></div>
  <div class="trow" title="grip spring strength"><b>K</b><input data-tune="grip" type="range" min="0.25" max="1.40" step="0.01"><output></output></div>
  <div id="tuneFoot"><button class="tmini" id="tuneReset" title="reset feel">↺</button><button class="tmini" id="tuneClose" title="close">×</button></div>
</div>
<div id="feelDot"></div>
<div id="thumbdeck">
  <div class="macroHome" id="macroHomeL"></div><div class="macroHome" id="macroHomeR"></div>
  <div class="joy" id="joyL" aria-label="left dual vector field"><div class="supportRing"></div><div class="inner"></div><div class="gate"></div><div class="depthhalo"></div><div class="bendmark"></div><div class="ghost"></div><div class="supportPuck"></div><div class="puck"></div></div>
  <div class="joy" id="joyR" aria-label="right dual vector field"><div class="supportRing"></div><div class="inner"></div><div class="gate"></div><div class="depthhalo"></div><div class="bendmark"></div><div class="ghost"></div><div class="supportPuck"></div><div class="puck"></div></div>
  <div id="polemini"><i></i><i></i></div>
  <div id="quick">
    <button class="q mode active" data-action="LIVE" aria-label="live performance" title="live performance">✦</button>
    <button class="q mode" data-action="WALK" aria-label="walk demonstration" title="walk demonstration">⇡</button>
    <button class="q mode" data-action="WAVE" aria-label="wave demonstration" title="wave demonstration">≈</button>
    <button class="q mode" data-action="SIT" aria-label="sit demonstration" title="sit demonstration">⌑</button>
    <button class="q mode" data-action="DANCE" aria-label="dance demonstration" title="dance demonstration">∞</button>
    <button class="q mode" data-action="FREE" aria-label="free puppet" title="free puppet">·</button>
    <button class="q" id="resetQuick" aria-label="reset" title="reset">↺</button>
  </div>
</div>

<div id="dojorail" aria-label="physics dojo">
  <button class="dj solverDemo on" data-dojo="REACH" title="solver: reach">→</button>
  <button class="dj solverDemo" data-dojo="STEP" title="solver: step">⇢</button>
  <button class="dj solverDemo" data-dojo="BRACE" title="solver: brace">⊣</button>
  <button class="dj solverDemo" data-dojo="GRASP" title="solver: grasp">⌁</button>
  <button class="dj solverDemo" data-dojo="SHIFT" title="solver: shift">↔</button>
  <button class="dj" data-dojo="WALL" title="wall">│</button>
  <button class="dj" data-dojo="BUTTON" title="button">•</button>
  <button class="dj" data-dojo="DOOR" title="door">╱</button>
  <button class="dj" data-dojo="DRAWER" title="drawer">▭</button>
  <button class="dj" data-dojo="CUP" title="cup">∪</button>
  <button class="dj" data-dojo="TRAY" title="tray">═</button>
  <button class="dj" data-dojo="BALL" title="ball">○</button>
  <button class="dj" data-dojo="KICK" title="kick ball">⊙</button>
  <button class="dj" data-dojo="CLOTH" title="cloth">≈</button>
  <button class="dj" data-dojo="CHAIR" title="chair">⌑</button>
  <button class="dj" data-dojo="WEIGHT" title="heavy weight">▰</button>
  <button class="dj" data-dojo="PROBE" title="resistant probe">⊢</button>
</div>

  ghostGroup.add(g); while(ghostGroup.children.length>12){const old=ghostGroup.children[0];ghostGroup.remove(old);old.traverse(o=>{o.geometry?.dispose();o.material?.dispose()})}
}

// ---------- capture: causes + world state ----------
let capture=false,captureFrames=[],captureEvents=[],captureStart=0,lastCap=0;
function ev(type,data={}){if(capture)captureEvents.push({t:+((performance.now()-captureStart)/1000).toFixed(3),type,...data})}
function captureFrame(t){
  if(!capture||t-lastCap<33)return;lastCap=t;
  const joints={};for(const [n,p] of Object.entries(P))joints[n]=[+p.p.x.toFixed(4),+p.p.y.toFixed(4),+p.p.z.toFixed(4)];
  captureFrames.push({t:+((t-captureStart)/1000).toFixed(3),cross:[+controller.position.x.toFixed(4),+controller.position.y.toFixed(4),+controller.position.z.toFixed(4)],rot:[+pitch.toFixed(4),+yaw.toFixed(4),+roll.toFixed(4)],reels:{...reels},thumbs:{L:[+thumbs.L.x.toFixed(3),+thumbs.L.y.toFixed(3),+thumbs.L.supportX.toFixed(3),+thumbs.L.supportY.toFixed(3),+thumbs.L.front.toFixed(3),+thumbs.L.bend.toFixed(3),+thumbs.L.roll.toFixed(3),+thumbs.L.macroX.toFixed(3),+thumbs.L.macroZ.toFixed(3)],R:[+thumbs.R.x.toFixed(3),+thumbs.R.y.toFixed(3),+thumbs.R.supportX.toFixed(3),+thumbs.R.supportY.toFixed(3),+thumbs.R.front.toFixed(3),+thumbs.R.bend.toFixed(3),+thumbs.R.roll.toFixed(3),+thumbs.R.macroX.toFixed(3),+thumbs.R.macroZ.toFixed(3)]},joints});
  if(captureFrames.length>1800)stopCapture(true);
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
function stopCapture(auto=false){
  if(!capture)return;capture=false;document.getElementById('captureBtn').classList.remove('live');document.getElementById('captureBtn').textContent='●';
  const data={format:'EVERYBODY-MARIONETTE-2',fps:30,feel:{...FEEL},events:captureEvents,frames:captureFrames};download('everybody-performance.json',new Blob([JSON.stringify(data)],{type:'application/json'}));
  stat.innerHTML=`performance saved — <span class="ok">${captureFrames.length} frames</span>${auto?' — 60 s ceiling':''}`;
}

// ---------- tuning surface ----------
const tuner=document.getElementById('tuner'),tuneBtn=document.getElementById('tuneBtn');
const tuneFmt={massKg:v=>Math.round(v),tension:v=>(+v).toFixed(2),joint:v=>Math.round(v*100),collision:v=>(+v).toFixed(2),damping:v=>Math.round(v*100),haptic:v=>Math.round(v*100),gain:v=>(+v).toFixed(2),expo:v=>Math.round(v*100),smooth:v=>Math.round(v*100),expression:v=>(+v).toFixed(2)+'×',depth:v=>(+v).toFixed(2)+'×',bend:v=>(+v).toFixed(2)+'×',recruit:v=>(+v).toFixed(2)+'×',objectMass:v=>(+v).toFixed(2)+'×',grip:v=>(+v).toFixed(2)+'×'};
function syncTune(){for(const input of tuner.querySelectorAll('[data-tune]')){const k=input.dataset.tune;input.value=FEEL[k];input.nextElementSibling.value=tuneFmt[k](FEEL[k])}}
function setTuner(on){tuner.classList.toggle('on',on);tuneBtn.classList.toggle('on',on);document.body.classList.toggle('tuning',on);if(on)syncTune()}
tuneBtn.addEventListener('click',e=>{e.stopPropagation();setTuner(!tuner.classList.contains('on'))});
document.getElementById('tuneClose').addEventListener('click',()=>setTuner(false));
document.getElementById('tuneReset').addEventListener('click',()=>{Object.assign(FEEL,DEFAULT_FEEL);applyMass();if(PHYS.ready)buildPhysicsTask(activeDojo);saveFeel();syncTune();HAPTIC.pulse(.35,'tick')});
for(const input of tuner.querySelectorAll('[data-tune]')){input.addEventListener('pointerdown',e=>{e.stopPropagation();orbit.enabled=false});input.addEventListener('input',()=>{const k=input.dataset.tune;FEEL[k]=+input.value;input.nextElementSibling.value=tuneFmt[k](FEEL[k]);if(k==='massKg')applyMass();if(k==='objectMass'&&PHYS.ready)buildPhysicsTask(activeDojo);saveFeel()});const done=()=>{if(activePointers.size===0&&!thumbs.L.active&&!thumbs.R.active)orbit.enabled=true};input.addEventListener('pointerup',done);input.addEventListener('pointercancel',done)}
syncTune();

// ---------- minimal UI ----------
function resetBody(){resetBodySolver();
  for(const [n,p] of Object.entries(P))p.reset(REST[n]);crossBase.set(0,2.28,0);yaw=0;
  for(const k of Object.keys(reels))reels[k]=0;
  for(const side of ['L','R']){const q=thumbs[side];q.x=q.y=q.rawX=q.rawY=q.vx=q.vy=q.px=q.py=q.outer=q.front=q.frontTarget=q.recruit=q.bend=q.bendTarget=q.supportX=q.supportY=q.supportVX=q.supportVY=q.macroX=q.macroZ=q.macroTX=q.macroTZ=q.macroVX=q.macroVZ=q.macroSpeed=q.macroKick=q.roll=0;q.gateStage=q.supportStage=q.macroStage=0;q.active=false;q.pointer=null;const el=document.getElementById('joy'+side);el.classList.remove('active','step','front','supporting');el.style.setProperty('--front','0');el.style.setProperty('--bend','0');el.querySelector('.puck').style.transform='translate(-50%,-50%)';el.querySelector('.supportPuck').style.transform='translate(-50%,-50%)';el.style.transform='translate(0,0)'}
  for(const id of Object.keys(studs))studs[id].active=true;for(const r of ropes)r.active=true
  stringsOn=true;resetDojo(activeDojo);updateController();updateStudMaterials();ev('reset');
}
function takeAll(){HAPTIC.pulse(.34,'tick');stringsOn=true;for(const id in studs)studs[id].active=true;for(const r of ropes)r.active=true;updateStudMaterials();ev('take_all')}
function dropAll(){HAPTIC.pulse(.52,'hit');stringsOn=false;ev('drop_all')}
document.getElementById('resetQuick').addEventListener('click',()=>{resetBody();setAction(action,false)});
document.querySelectorAll('.q.mode').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.action;if(n==='LIVE'||n==='FREE'){teacherOn=false;teachBtn.classList.remove('on');document.body.classList.add('no-teacher')}else{teacherOn=true;teachBtn.classList.add('on');document.body.classList.remove('no-teacher')}setAction(n)}));
const teachBtn=document.getElementById('teachBtn');
teachBtn.addEventListener('click',()=>{teacherOn=!teacherOn;if(teacherOn&&action==='LIVE')setAction('DANCE');teachBtn.classList.toggle('on',teacherOn);document.body.classList.toggle('no-teacher',!teacherOn);HAPTIC.pulse(.25,'tick');ev('teacher',{on:teacherOn})});
document.getElementById('captureBtn').addEventListener('click',function(){
  if(capture){stopCapture();return}capture=true;captureFrames=[];captureEvents=[];captureStart=performance.now();lastCap=0;this.classList.add('live');
});

const styleName=document.getElementById('styleName');
document.getElementById('styleBtn').addEventListener('click',()=>{
  style=style==='WHITE'?'INK':'WHITE';styleName.textContent=style;
  scene.background.set(style==='WHITE'?0xffffff:0x111111);floorMat.color.set(style==='WHITE'?0xf7f7f7:0x111111);floorRing.material.color.set(style==='WHITE'?0x000000:0xffffff);
  woodMat.color.set(style==='WHITE'?0x2c2927:0xe8e8e8);
  for(let i=0;i<bodyMats.length;i++){if(style==='INK')bodyMats[i].color.set(0xffffff)}
  if(style==='WHITE'){
    for(const s of segMeshes)s.mesh.material.color.set(whiteBands[s.tone]);
    for(const j of jointMeshes)j.mesh.material.color.set(j.name==='head'?0x222222:(j.name.includes('Hand')||j.name.includes('Foot')?0x333333:0x9e9e9e));
  }
});

document.getElementById('exportBtn').addEventListener('click',()=>{
  // Export the visible current body + cross + strings as a posed GLB artifact.
  const exportRoot=new THREE.Group();exportRoot.name='EVERYBODY-MARIONETTE';
  const bodyClone=bodyGroup.clone(true);const ctrlClone=controller.clone(true);const stringsClone=stringGroup.clone(true);exportRoot.add(bodyClone,ctrlClone,stringsClone);
  new GLTFExporter().parse(exportRoot,glb=>{download('everybody-marionette.glb',new Blob([glb],{type:'model/gltf-binary'}));stat.innerHTML='everybody-marionette.glb — <span class="ok">current physical pose exported</span>'},e=>{stat.innerHTML='<span class="hot">export failed</span> '+e},{binary:true});
});

// ---------- render loop ----------
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let acc=0,last=performance.now(),fps=60,fc=0,ft=last;
function frame(t){
  requestAnimationFrame(frame);let dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;
  while(acc>=DT){integrate();acc-=DT}
  updateController();syncBody();for(const r of ropes)updateRopeVisual(r);stringGroup.visible=stringsOn;updateDiag();renderThumbPucks();updateDojoVisuals();captureFrame(t);orbit.update();renderer.render(scene,camera);
  fc++;if(t-ft>500){fps=fc*1000/(t-ft);fc=0;ft=t}
  const lT=Math.max(0,...ropes.filter(r=>r.stud==='L'||r.stud==='F').map(r=>r.tension));
  const rT=Math.max(0,...ropes.filter(r=>r.stud==='R'||r.stud==='B').map(r=>r.tension));
  const lf=Math.max(PHYS.handLoads.L||0,...ropes.filter(r=>r.stud==='L'||r.stud==='F').map(r=>r.forceN||0),0),rf=Math.max(PHYS.handLoads.R||0,...ropes.filter(r=>r.stud==='R'||r.stud==='B').map(r=>r.forceN||0),0);
  if(thumbs.L.active&&lf>220)HAPTIC.pulse(Math.min(1,lf/1800),'tick','L');
  if(thumbs.R.active&&rf>220)HAPTIC.pulse(Math.min(1,rf/1800),'tick','R');
  if(limitActivity>.48)HAPTIC.pulse(limitActivity,'limit');else if(collisionActivity>.48)HAPTIC.pulse(collisionActivity,'hit');
  document.getElementById('loadL').style.transform=`scaleX(${Math.min(1,.06+lf/1700)})`;
  document.getElementById('loadR').style.transform=`scaleX(${Math.min(1,.06+rf/1700)})`;
  if(!capture){const taut=ropes.filter(r=>r.active&&r.tension>.003).length;stat.textContent=`${taut}/${ropes.length} ${fps.toFixed(0)}`;}
}
resetDojo('REACH');
setAction('LIVE',false);document.body.classList.toggle('no-teacher',!teacherOn);syncBody();updateDiag();renderThumbPucks();updateController();for(const r of ropes)updateRopeVisual(r);renderer.render(scene,camera);requestAnimationFrame(frame);setTimeout(()=>initDojoPhysics(),40);
// Blank-screen guard: if initialization reached this point, the puppet exists.
// A later exception is surfaced rather than failing silently.
window.addEventListener('error',e=>{try{console.error('EVERYBODY runtime',e.message||e.error||e)}catch(_){}});

// Public surface for embedding / experiments.
window.EVERYBODY={THREE,scene,camera,renderer,particles:P,controller,ropes,molecules:MOVEMENT_MOLECULES,bodySolver:BODY_SOLVER,
  reset:resetBody,action:setAction,actions:ACTIONS.slice(),live:()=>setAction('LIVE'),teacher:v=>{teacherOn=!!v;teachBtn.classList.toggle('on',teacherOn);document.body.classList.toggle('no-teacher',!teacherOn)},drop:()=>{stringsOn=false},take:()=>{stringsOn=true},
  keep:keepGhost,setGravity:v=>gravityOn=!!v,
  feel:FEEL,setFeel:(patch)=>{Object.assign(FEEL,patch||{});applyMass();saveFeel();syncTune();return {...FEEL}},
  haptic:(strength=.5)=>HAPTIC.pulse(strength,'tick'),
  setReel:(id,v)=>{if(id in reels){reels[id]=THREE.MathUtils.clamp(v,-.55,.55);updateController()}},
  moveController:(x,y,z)=>{crossBase.set(x,y,z);updateController()},
  thumb:(side,x,y,z=0,bend=0)=>{if(thumbs[side]){const q=thumbs[side];q.rawX=THREE.MathUtils.clamp(x,-1.55,1.55);q.rawY=THREE.MathUtils.clamp(y,-1.55,1.55);q.frontTarget=THREE.MathUtils.clamp(z,0,1);q.bendTarget=THREE.MathUtils.clamp(bend,0,1);q.active=true}},
  support:(side,x,y)=>{if(thumbs[side]){thumbs[side].supportX=THREE.MathUtils.clamp(x,-1,1);thumbs[side].supportY=THREE.MathUtils.clamp(y,-1,1)}},
  macro:(side,x,z)=>{if(thumbs[side]){thumbs[side].macroTX=THREE.MathUtils.clamp(x,-1,1);thumbs[side].macroTZ=THREE.MathUtils.clamp(z,-1,1)}},
  dojo:(name)=>{if(DOJOS.includes(name))resetDojo(name)},dojos:DOJOS.slice(),solverDemos:['REACH','STEP','BRACE','GRASP','SHIFT'],physics:PHYS
};
