<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>COMMON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --w:#ffffff; --k:#000000;
  --teal:#19e6c8; --amber:#ffd23f; --red:#ff2e2e; --blue:#3b82f6;
  --world:50vh;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--w);color:var(--k);font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.45;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--w);border:1px solid var(--k);padding:10px 14px;min-height:44px;cursor:pointer;letter-spacing:.04em}
button:active{background:var(--k);color:var(--w)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--k);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--w);border:1px solid var(--k);padding:10px 12px;min-height:44px;width:100%;border-radius:0;-webkit-appearance:none;appearance:none}
textarea{min-height:120px;resize:vertical;line-height:1.4}
a{color:inherit}
.hide{display:none!important}
.mark{display:inline-block;vertical-align:middle}

/* REST */
#rest{position:fixed;inset:0;background:var(--w);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:50;overflow:hidden}
#title{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#caption{position:absolute;left:0;right:0;bottom:calc(18% + var(--sab));text-align:center;font-size:14px;padding:0 24px;pointer-events:none;opacity:0;transition:opacity .5s}
#caption.on{opacity:1}
#skip{position:absolute;right:14px;top:calc(14px + var(--sat));border:0;font-size:11px;letter-spacing:.1em;opacity:.6;min-height:44px}
#rest .title{font-size:22px;letter-spacing:.42em;padding-left:.42em;margin-bottom:4px;font-weight:500;text-align:center}
#rest .sub{font-size:11px;letter-spacing:.08em;opacity:.7;text-align:center;margin-bottom:28px}
#rest form{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;background:var(--w);padding:18px 0;animation:fadein .6s ease-out}
#enternokey{border:1px dashed var(--k);font-size:12px}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#rest label{display:block;font-size:12px;margin-bottom:6px}
#rest .warn{font-size:12px;opacity:.85;margin-top:8px}
#rest .stat{min-height:24px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#rest .stat .why{flex-basis:100%;font-size:12px;opacity:.8;white-space:pre-wrap;word-break:break-word}
#rest .row{display:flex;gap:10px}
#rest .row button{flex:1}
.selwrap{position:relative}
.selwrap:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:1px solid var(--k);border-bottom:1px solid var(--k);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* CHASSIS */
#app{position:fixed;inset:0;display:grid;grid-template-rows:calc(44px + var(--sat)) var(--world) 18px 1fr;background:var(--w)}
header{position:relative;z-index:3;display:grid;grid-template-columns:44px 1fr 44px;align-items:end;padding-top:var(--sat);border-bottom:1px solid var(--k)}
header .brand{text-align:center;letter-spacing:.42em;padding-left:.42em;font-weight:500;font-size:15px;line-height:44px;cursor:pointer;user-select:none}
header .clock{white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%);top:100%;font-size:10px;background:var(--w);padding:0 6px;line-height:16px;border:1px solid var(--k);border-top:0}
header button{border:0;min-height:44px;height:44px;width:44px;padding:0;display:flex;align-items:center;justify-content:center}
header button:active{background:var(--w);color:var(--k)}
#worldwrap{position:relative;overflow:hidden;background:var(--w)}
#worldsvg{width:100%;height:100%;display:block;touch-action:none;user-select:none}
#edges{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:space-between;pointer-events:none;padding:0 6px;gap:6px}
#edges .edge{pointer-events:auto;font-size:10px;line-height:1.3;border:1px solid var(--k);background:var(--w);padding:6px 8px;max-width:46%;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px}
#edges .edge b{font-weight:600;display:block;font-size:11px}
#edges .edge span{opacity:.75;display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#edges .edge.hot{box-shadow:inset 0 -3px 0 var(--k)}
#nav{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:90px;height:90px;cursor:pointer;touch-action:none}
#sitename{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.2em;pointer-events:none}
#cast{position:absolute;right:8px;top:54px;font-size:10px;border:1px solid var(--k);background:var(--w);padding:6px 8px;cursor:pointer;min-height:44px;display:flex;align-items:center;pointer-events:auto}
#elsewhere{padding:6px 14px;border-bottom:1px solid var(--k);font-size:12px;opacity:.75;cursor:pointer;display:flex;justify-content:space-between}
.scene .bd path,.scene .bd rect,.scene .bd circle,.scene .bd ellipse,.scene .bd line,.scene .bd polyline,.scene .bd polygon{fill:none;stroke:var(--k);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.scene .bd .w{fill:var(--w)}
.scene .bd text{font-size:9px;letter-spacing:.12em;fill:var(--k)}
.bub rect{fill:var(--w);stroke:var(--k);stroke-width:1}
.bub path{fill:var(--w);stroke:var(--k);stroke-width:1}
.bub text{font-size:8.5px;fill:var(--k)}
.agent .nm{font-size:9px}
.agent .st{font-size:8px}
.frame rect.f{fill:var(--w);stroke:var(--k);stroke-width:1}
.frame{cursor:pointer}
.frame.new rect.f{animation:appear .5s ease-out}
.frame.pulse image{animation:pulse .9s ease-in-out 3}
.lnk{text-decoration:none;font-weight:600;cursor:pointer}
#abtab{position:absolute;top:8px;right:8px;display:flex;justify-content:flex-start;gap:0;pointer-events:none}
#abtab span{pointer-events:auto;font-size:11px;padding:4px 10px;border:1px solid var(--k);background:var(--w);cursor:pointer;min-width:44px;text-align:center}
#abtab span.on{background:var(--k);color:var(--w)}
#seam{border-top:1px solid var(--k);border-bottom:1px solid var(--k);display:flex;align-items:center;justify-content:center;gap:10px;touch-action:none;cursor:ns-resize;background:var(--w);user-select:none}
#seam i{display:block;width:40px;height:2px;background:var(--k)}
#seam svg{width:10px;height:10px;opacity:.8}
#stream{display:grid;grid-template-rows:1fr auto;min-height:0;background:var(--w)}
#feed{overflow-y:auto;overscroll-behavior:contain;padding:0 0 8px 0}
.item{padding:10px 14px;border-bottom:1px solid #000;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}
.item .who .av{display:inline-block;width:26px;height:26px;vertical-align:middle;margin-right:8px;border:1px solid var(--k);background:var(--w)}
.item .who .av svg{width:100%;height:100%;display:block}
.item.focus .head{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin-bottom:6px}
.item.focus .head .av{width:64px;height:64px;border:1px solid var(--k);background:var(--w)}
.item.focus .head .av svg{width:100%;height:100%;display:block}
.item.focus .head .who{font-size:15px}
.gauge{margin:8px 0;font-size:12px}
.gauge .lean{font-weight:600;margin-bottom:6px}
.gauge .ax{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;padding:3px 0}
.gauge .ax i{display:block;position:relative;height:10px;border-left:1px solid var(--k);border-right:1px solid var(--k)}
.gauge .ax i:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--k);opacity:.4}
.gauge .ax i b{position:absolute;top:0;width:8px;height:10px;background:var(--k);margin-left:-4px}
.gauge .ends{display:grid;grid-template-columns:96px 1fr;font-size:10px;opacity:.6}
.gauge .ends span{display:flex;justify-content:space-between}
.cluster{padding:6px 14px;border-bottom:1px solid #000;font-size:12px;opacity:.7;cursor:pointer;display:flex;justify-content:space-between}
.cluster.open{opacity:1}
.item .meta{grid-column:1/-1;font-size:11px;opacity:.7;display:flex;gap:12px;cursor:pointer}
.cmt{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:4px 0;font-size:12px}
.cmt .av{width:22px;height:22px;border:1px solid var(--k)}
.cmt .av svg{width:100%;height:100%;display:block}
.cmt b{font-weight:600;margin-right:6px}
.belief{font-size:12px;padding:4px 0 4px 10px;border-left:2px solid var(--k);margin:3px 0}
.belief small{display:block;opacity:.6;font-size:10px}
.item.focus pre.sess{max-height:40vh}
.item.mine{box-shadow:inset 4px 0 0 var(--k)}
.agent.dimmed .fig{opacity:.3}
.agent.dimmed text{opacity:.3}
.item.news{grid-template-columns:1fr}
.item.news .mast{font-size:10px;letter-spacing:.2em;border-bottom:1px solid var(--k);padding-bottom:3px;margin-bottom:4px;display:flex;justify-content:space-between}
.item.news .hl{font-weight:600;font-size:15px;line-height:1.3;margin-bottom:4px}
.item.news .body{font-size:13px}
.galhead{display:flex;gap:0;margin-bottom:8px}
.galhead button{flex:1;min-height:34px;padding:4px;font-size:11px;border-right:0}
.galhead button:last-child{border-right:1px solid var(--k)}
.galhead button.on{background:var(--k);color:var(--w)}
.rank{display:grid;grid-template-columns:28px 64px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--k);font-size:12px;cursor:pointer}
.rank .n{font-weight:600}
.rank canvas{width:64px;height:64px;border:1px solid var(--k);display:block}
.rank .tag{font-size:10px;opacity:.7}
.prow{padding:8px 0;border-bottom:1px dashed var(--k);font-size:13px}
.prow .by{font-size:11px;opacity:.7;margin-bottom:2px}
.worksec{margin:10px 0 4px;font-size:12px;display:flex;justify-content:space-between}
.gal .g .tag{position:absolute;left:0;bottom:0;font-size:7px;background:var(--w);padding:0 2px;border-top:1px solid var(--k);border-right:1px solid var(--k)}
.tie{transition:none}
.item.dim{opacity:.55}
.item .who{font-weight:600;font-size:12px;letter-spacing:.02em;cursor:pointer}
.item .who small{font-weight:400;opacity:.7;margin-left:8px}
.item .say{grid-column:1/-1;font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.item .fact{font-size:13px;margin-top:2px}
.item .fact .why{opacity:.7;display:block;font-size:12px}
.item .thumb{width:72px;height:72px;border:1px solid var(--k);background:var(--w);cursor:pointer;grid-row:span 3}
.item .thumb canvas{width:100%;height:100%;display:block}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.item .acts button{padding:8px 12px;min-height:40px;font-size:12px}
.item.focus{border-top:2px solid var(--k);border-bottom:2px solid var(--k);background:var(--w)}
.item.focus .close{border:0;min-height:36px;padding:0 8px;font-size:12px}
.item.focus .art{width:100%;max-width:280px;aspect-ratio:1;border:1px solid var(--k);margin:8px 0}
.item.focus .art canvas{width:100%;height:100%;display:block}
.item.focus .text{font-size:14px;white-space:pre-wrap;border:1px solid var(--k);padding:12px;margin:8px 0;max-width:280px}
.item.focus .lineage{font-size:13px;margin:6px 0}
.item.focus .lineage div{padding:2px 0}
.item.focus .lineage .arrow{opacity:.6;padding-left:14px}
.item.focus .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:12px;margin:8px 0}
.item.focus .bars{margin:6px 0;font-size:12px}
.item.focus .bars div{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:8px;padding:2px 0}
.item.focus .bars b{display:block;height:6px;background:var(--k);transform-origin:left}
.item.focus pre{font-size:11px;white-space:pre-wrap;border:1px dashed var(--k);padding:8px;margin:6px 0;max-height:220px;overflow:auto}
.item.focus .memo{font-size:12px;padding:2px 0 2px 10px;border-left:1px solid var(--k);margin:2px 0}
.item.card{grid-template-columns:1fr}
.item.card .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.item.card .opts button{padding:10px 6px;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-height:64px}
.item.card .opts button small{font-size:10px;letter-spacing:0;opacity:.75}
.item.gallery{display:block;padding:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.gal .g{aspect-ratio:1;border:1px solid var(--k);position:relative;cursor:pointer;background:var(--w);overflow:hidden}
.gal .g canvas{width:100%;height:100%;display:block}
.gal .g .t{position:absolute;inset:0;font-size:7px;padding:4px;overflow:hidden;line-height:1.2}
.gal .g .p{position:absolute;right:0;bottom:0;width:8px;height:8px}
.gal .g.trained:after{content:"";position:absolute;left:0;top:0;width:0;height:0;border-top:10px solid var(--blue);border-right:10px solid transparent}
.gal .g.withdrawn{opacity:.35}
.item.work{grid-template-columns:1fr auto}
.item.work .prog{height:2px;background:var(--k);width:0;transition:width .6s linear}
.item.work .bar{border:1px solid var(--k);height:8px;padding:2px;margin-top:6px}
.variants{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.variants .v{aspect-ratio:1;border:1px solid var(--k);position:relative}
.variants .v canvas{width:100%;height:100%;display:block}
.variants .v.chosen{outline:2px solid var(--k);outline-offset:2px}
.variants .v.gone{opacity:.15}
.abrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}
.abrow div{border:1px solid var(--k);padding:8px}
.abrow h4{font-size:12px;font-weight:600;margin-bottom:4px}
#compose{display:grid;grid-template-columns:1fr 60px;border-top:1px solid var(--k);padding-bottom:var(--sab)}
#compose input{border:0;min-height:52px;padding:0 14px}
#compose button{border:0;border-left:1px solid var(--k);min-height:52px}
#compose .ctx{grid-column:1/-1;font-size:11px;padding:4px 14px 0;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--k)}
#compose .ctx button{border:0;min-height:28px;padding:0 6px;font-size:11px}

/* SVG WORLD */
.place text{font-size:9px;letter-spacing:.08em;fill:var(--k)}
.place path,.place rect,.place circle,.place ellipse,.place line,.place polyline,.place polygon{fill:none;stroke:var(--k);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.place .fill{fill:var(--w)}
.agent{cursor:pointer}
.agent .hit{fill:transparent;stroke:none}
.fig path,.fig circle,.fig rect,.fig line{stroke:var(--k);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;fill:none;vector-effect:non-scaling-stroke}
.fig .w{fill:var(--w)}
.fig .k{fill:var(--k);stroke:none}
.fig .prop{display:none}
.agent .fig.p-board .board,.agent .fig.p-page .page,.agent .fig.p-screen .screen,.agent .fig.p-point .point,.agent .fig.p-talk .talk{display:inline}
.agent .fig.p-board .armR,.agent .fig.p-page .armR,.agent .fig.p-screen .armR,.agent .fig.p-point .armR{display:none}
.agent text{font-size:8px;fill:var(--k);text-anchor:middle;pointer-events:none}
.agent .st{font-size:7px;opacity:.75}
.agent.sel .ring{fill:none;stroke:var(--k);stroke-width:1;stroke-dasharray:2 2}
.agent.left .fig{opacity:.35}
.ink{filter:url(#wob)}
.agent .fault{fill:var(--red)}
.agent .work{fill:var(--k)}
.tie{stroke:var(--k);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
.tie.teach{stroke-dasharray:1 3}
.tie.conflict{stroke:var(--red)}
.tie.breaking{stroke-dasharray:6 4;animation:snap .9s steps(6) forwards}
@keyframes snap{to{stroke-dashoffset:40;opacity:0}}
.artw{cursor:pointer}
.artw rect.frame{fill:var(--w);stroke:var(--k);stroke-width:.8}
.artw.new rect{animation:appear .5s ease-out}
@keyframes appear{from{transform:scale(0)}to{transform:scale(1)}}
.artw.pulse image{animation:pulse .9s ease-in-out 3}
@keyframes pulse{50%{opacity:.25}}
.model .core{fill:none;stroke:var(--k);stroke-width:1}
.model .dot{fill:var(--k)}
.model text{font-size:8px;text-anchor:middle;fill:var(--k)}
.model.sel .core{stroke-width:2}
.ray{stroke:var(--blue);stroke-width:1;fill:none;stroke-dasharray:3 3;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.wlabel{font-size:8px;fill:var(--k)}
.wlabel.fault{fill:var(--red)}
.stopbtn rect{fill:var(--w);stroke:var(--k);stroke-width:1}
.stopbtn text{font-size:7px;fill:var(--k);text-anchor:middle;pointer-events:none}
.stopbtn{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* SHEETS */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--w);border-top:1px solid var(--k);z-index:40;padding:14px 14px calc(14px + var(--sab));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease-out}
.sheet.on{transform:none}
.scrim{position:fixed;inset:0;z-index:39;background:transparent}
.sheet h3{font-size:12px;font-weight:600;letter-spacing:.06em;margin-bottom:10px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sheet .row button{flex:1 1 auto}
.sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;margin-bottom:8px}
.sheet .kv span:nth-child(odd){opacity:.7}
.sheet .tabs{display:flex;gap:0;margin:8px 0}
.sheet .tabs button{flex:1;min-height:36px;padding:6px;font-size:11px;border-right:0}
.sheet .tabs button:last-child{border-right:1px solid var(--k)}
.sheet .tabs button.on{background:var(--k);color:var(--w)}
.sheet textarea{font-size:12px;min-height:38vh}
#fault{position:fixed;inset:0;z-index:60;background:var(--w);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#fault .row{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
</style>
</head>
<body>

<div id="rest">
  <canvas id="title"></canvas>
  <div id="caption"></div>
  <button id="skip" type="button">SKIP</button>
  <form id="restform" autocomplete="off" class="hide">
    <div class="title">COMMON</div>
    <div class="sub">the corpus is not the commons</div>
    <div>
      <label for="key">API KEY</label>
      <input id="key" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="••••••••••••">
    </div>
    <div>
      <label for="model">MODEL</label>
      <input id="model" list="models" value="gpt-5.6-sol" autocomplete="off" spellcheck="false">
      <datalist id="models"><option value="gpt-5.6-sol"><option value="gpt-5.6-terra"><option value="gpt-5.6-luna"></datalist>
    </div>
    <button type="submit" id="enter">ENTER</button>
    <button type="button" id="enternokey">LOOK AROUND WITHOUT A KEY</button>
    <div class="stat" id="reststat"></div>
    <div class="warn">Browser keys can be inspected. Use a development/testing key. Without a key nobody can make, write, or speak.</div>
  </form>
</div>

<div id="app" class="hide">
  <header>
    <button id="pause" aria-label="pause" title="pause"><svg class="mark" width="16" height="16" viewBox="0 0 16 16" id="pauseico"><rect x="3" y="2" width="3" height="12" fill="#000"/><rect x="10" y="2" width="3" height="12" fill="#000"/></svg></button>
    <div class="brand" id="brand">COMMON</div>
    <button id="aistat" aria-label="AI status" title="AI"><svg class="mark" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#000"/><circle cx="8" cy="8" r="2" fill="#000"/></svg></button>
    <div class="clock" id="clock"></div>
  </header>
  <div id="worldwrap">
    <svg id="worldsvg" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid meet"></svg>
    <canvas id="nav" width="180" height="180"></canvas><div id="sitename"></div><div id="cast" class="hide"></div><div id="edges"><div class="edge" id="edgeL"></div><div class="edge" id="edgeR"></div></div><div id="abtab" class="hide"><span data-w="0">A</span><span data-w="1">B</span></div>

async function llm(system, user, opts={}){

    const body = { model: AI.model, max_output_tokens: opts.maxTokens || 900,
      input: [ { role:'system', content: system }, { role:'user', content: user } ] };

      method:'POST', signal: ac.signal,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + AI.key },
      body: JSON.stringify(body) });

    if(e.name === 'AbortError') throw new NetFault('stopped', 'abort');
    if(e instanceof NetFault){ AI.failed++; throw e; }
    AI.failed++;
    throw new NetFault(e.message || 'network', 'global');

    AI.inflight--; AI.controllers.delete(ac); updateCalls();
  }

/* ---------- TICK ---------- */
function tickWorld(w){
  w.tick++; if(w.llmCooldown>0) w.llmCooldown--; if(w.reflectCooldown>0) w.reflectCooldown--; if(w.exchangeCooldown>0) w.exchangeCooldown--; if(w.commentCooldown>0) w.commentCooldown--; if(w.compactCooldown>0) w.compactCooldown--;

  const live = w.agents.filter(a=>!a.left);

  for(let i=0;i<3;i++){ const a = w.rng.pick(live); const ids = Object.keys(a.relationships); if(!ids.length) continue; const b = agentById(w, w.rng.pick(ids)); if(b && !b.left && !a.working && !b.working) influencePair(w,a,b); }
  attention(w);
  if(w.tick % 6 === 0) rewire(w);
  if(w.tick % 10 === 0) cascade(w);
  if(w.tick % 24 === 0) economy(w);
  processRejections(w);
  // agent actions
  for(const a of live){ if(a.working || a.fault) continue; if(a.cooldown>0){ a.cooldown--; continue; }
    if(AI.key && w.tick - a.lastSalient < 3 && a.memories.length && w.rng.next()<.35 && w.reflectCooldown===0){ doReflect(w,a); continue; }
    act(w,a); }

  if(AI.key && w.tick - w.press.last >= 26 && AI.inflight<3 && !w.press.busy){ const strong = w.feed.filter(i=>i.kind==='fact' && i.strong && i.tick>w.press.last); const said = w.feed.filter(i=>i.kind==='say' && i.tick>w.press.last); if(strong.length + said.length >= 3) pressIssue(w); }
  // commissions: the market hires the famous
  if(w.tick % 40 === 20){ const live=w.agents.filter(a=>!a.left && !a.working && !a.commission); if(live.length){ live.sort((p,q)=>q.status-p.status); const star=live[0]; if(star.status>.4){ const product = w.rng.pick(['a boat hire','the market\u2019s bread','a lamp','a ferry ticket','a coat']); star.commission = `the market asked for a piece to sell ${product}; it must be legible as an advertisement`; const e=emit(w,'COMMISSION',star.id,{product}); fact(w, `The market hired ${star.name} to make an ad for ${product}.`, {strong:true, eventId:e.id, agentId:star.id}); remember(star,w,'the market hired me for an ad',e.id,.3); star.next='draw'; star.cooldown=0; } } }
  // model hint
  if(canTrain(w) && w.tick - w.model.lastHint > 30 && w.tick - w.model.lastTrainedAt > 20){ w.model.lastHint = w.tick; fact(w, 'It can learn from the pool.', {model:true, trainHint:true, eventId:null}); }
  markDirty('world'); if(w.tick % 4 === 0){ markDirty('feed'); markDirty('focus'); }
  if(w.tick % 12 === 0) markDirty('clock');
}

/* ---------- COMPOSER: TYPE → INTERPRET → VALIDATE → EVENT ---------- */
$('#send').onclick = ()=>submitSay(); $('#say').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitSay(); } });
$('#ctxclear').onclick = ()=>{ ctxTarget=null; markDirty('feed'); };
function localIntent(w, text){
  const t=text.trim(); const low=t.toLowerCase();
  let m;
  if((m = t.match(/^@(\w+)\s*(.*)$/))){ const a=agentByName(w,m[1]); if(a) return {intent:'ask', target:a, text:m[2]||''}; }
  if((m = t.match(/^(ask|tell)\s+(\w+)\s*(.*)$/i))){ const a=agentByName(w,m[2]); if(a) return {intent: m[1].toLowerCase(), target:a, text:m[3]||''}; }
  if(/^(fork)\b/.test(low)) return {intent:'fork'};
  if(/^(compare|a\s*\/\s*b|diff)\b/.test(low)) return {intent:'compare'};
  if(/(let it read|^train\b|train the model|train now)/.test(low)) return {intent:'train'};
  if(/^(show|open)\s+(the\s+)?(pool|archive|gallery)/.test(low)) return {intent:'show', what:'pool'};
  if(/^(show|open)\s+(the\s+)?model/.test(low)) return {intent:'show', what:'model'};
  if((m = low.match(/^(show|open)\s+(\w+)/))){ const a=agentByName(w,m[2]); if(a) return {intent:'show', target:a}; }
  const isRule = /(train|rule|polic|weights|consent|opt|pay|compens|commons)/.test(low) && /(make|set|require|let|allow|no |stop|open|close|ask|pay|return|should|now|propose)/.test(low);
  if(isRule){ if(/opt.?in|consent|contributor|ask/.test(low)) return {intent:'policy', policy:'ASK'}; if(/pay|compens/.test(low)) return {intent:'policy', policy:'PAY'}; if(/return|share value|community/.test(low)) return {intent:'policy', policy:'RETURN'}; if(/weights|open model|open the model/.test(low)) return {intent:'policy', policy:'OPEN_MODEL'}; if(/close|no training|stop training|forbid|ban/.test(low)) return {intent:'policy', policy:'CLOSE'}; if(/open|anything|everything|free/.test(low)) return {intent:'policy', policy:'OPEN'}; }
  if(ctxTarget){ const a=agentById(w,ctxTarget); if(a) return {intent:'ask', target:a, text:t}; }
  return null;
}
async function submitSay(){
  const w = world(); if(!w) return; const inp=$('#say'); const text=inp.value.trim(); if(!text) return; inp.value='';
  let it = localIntent(w, text);
  if(!AI.key && (!it || it.intent==='ask' || it.intent==='tell')){ fact(w, 'Nobody can answer without a key. Tap COMMON to add one.', {dim:true}); return; }
  if(!it){ const item = feedPush(w,{kind:'work', who:'YOU', text:'reading intent', live:false});
    try{ const out = await llm(PROMPTS.INTENT, `AGENTS: ${w.agents.filter(a=>!a.left).map(a=>a.name).join(', ')}\nPOLICIES: OPEN, ASK, PAY, RETURN, OPEN_MODEL, CLOSE\nCURRENT RULE: ${w.institutions.trainingPolicy||'none'}\nMESSAGE: ${text}`, {maxTokens:120}); const j=parseJSON(out)||{}; item.text = 'read as '+(j.intent||'nothing'); const a=agentByName(w,j.target); it = {intent:j.intent, target:a, text:j.text||text, policy:j.policy, what: j.intent==='show'? (j.target? null : 'pool') : null}; }
    catch(e){ item.text="couldn't read that"; if(e.kind==='global'||e.kind==='auth') globalFault(e); markDirty('feed'); return; } }
  if(!it || !it.intent || it.intent==='none'){ fact(w, 'Nothing in the world answers to that. Try: ask Mara why she stopped posting \u00b7 make training opt-in \u00b7 show the pool.', {dim:true}); return; }
  if(it.intent==='fork'){ const last = w.forkable.slice(-1)[0]; if(last && worlds.length<2) forkFrom(last); else fact(w, worlds.length>1? 'Two worlds already run.' : 'Nothing consequential has happened yet to fork from.', {dim:true}); return; }
  if(it.intent==='compare'){ if(worlds.length<2){ fact(w,'One world so far.',{dim:true}); return; } w.compareAt = w.tick; markDirty('feed'); return; }
  if(it.intent==='train'){ if(canTrain(w)) startTrain(w); else fact(w, w.model.exists? (w.model.training? 'It is reading now.' : `Not enough new eligible work yet (${eligibleArtifacts(w).length}).`) : 'There is no generator yet.', {dim:true}); return; }
  if(it.intent==='show'){ if(it.target) setFocus({type:'agent',id:it.target.id}); else if(it.what==='model') setFocus({type:'model',id:'model'}); else { galleryMode=true; seamRatio=.15; document.documentElement.style.setProperty('--world','15vh'); markDirty('feed'); } return; }
  if(it.intent==='policy'){ if(!w.model.exists){ fact(w,'There is nothing to govern yet. No generator exists.',{dim:true}); return; } proposePolicy(w, it.policy, 'player'); return; }
  if((it.intent==='ask'||it.intent==='tell') && it.target){ const a=it.target; const msg = it.text || text;
    const e=emit(w,'PLAYER_SAID',null,{to:a.id, text:msg}); feedPush(w,{kind:'say', who:'YOU', to:a.name, text:msg, eventId:e.id});
    if(a.left){ fact(w, `${a.name} is gone.`, {dim:true}); return; }
    if(a.working){ if(a.working.ac) a.working.ac.abort(); await new Promise(r=>setTimeout(r,200)); }
    remember(a,w,`someone from outside said: ${msg.slice(0,60)}`,e.id,.1);
    startWork(w,a,'answering', async (onC)=>{
      const out = await llm(PROMPTS.ARGUMENT, agentContext(w,a,`SPEAKER: the player (an outside observer who can propose rules)\nMESSAGE: ${msg}`), {onController:onC, maxTokens:220});
      const j = parseJSON(out) || {utterance: out.slice(0,200)}; const u = String(j.utterance||'').slice(0,240); if(!u) throw new NetFault('no answer came back','local');
      const e2=emit(w,'UTTERANCE',a.id,{text:u, to:'player', will:j.will||null},[e.id]); say(w,a,u,{to:'you', eventId:e2.id});
      if(j.will==='withhold'){ a.withholding=true; emit(w,'WITHHOLD',a.id,{},[e2.id]); }
      if(j.will==='share'){ a.withholding=false; }
      if(j.will==='publish'){ a.withholding=false; const priv=w.artifacts.filter(x=>x.creatorId===a.id&&!x.published); if(priv.length){ const x=priv[priv.length-1]; x.published=true; const e3=emit(w,'ARTIFACT_PUBLISHED',a.id,{artifact:x.id},[e2.id]); feedPush(w,{kind:'art',agentId:a.id,who:a.name,text:'published this.',artId:x.id,eventId:e3.id}); } }
      if(j.will==='teach') a.next='teach'; if(j.will==='stop'){ a.cooldown=8; }
      if(j.will==='leave' && a.autonomy>.5){ a.left=true; a.tx=340; a.ty=285; const e3=emit(w,'AGENT_EXITED',a.id,{},[e2.id],{snapshot:true}); fact(w,`${a.name} left.`,{strong:true,eventId:e3.id,fork:e3.id,agentId:a.id}); }
    });
    return; }
  fact(w, 'Nothing in the world answers to that.', {dim:true});
}

$('#exportbtn').onclick = ()=>{ const data = { exported:new Date().toISOString(), model:AI.model, prompts:PROMPTS, worlds: worlds.map(w=>snapshotWorld(w)) }; const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='common-'+Date.now()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); };
$('#exportfeed').onclick = ()=>{ const w=world(); if(!w) return; const L=[`# COMMON \u00b7 world ${w.id} \u00b7 ${dayclock(w.tick)}`, `model ${AI.model} \u00b7 tokens ${fmtTok(AI.tokIn)} in / ${fmtTok(AI.tokOut)} out`, `rule: ${w.institutions.trainingPolicy||'none'} \u00b7 model read ${w.model.trainedIds.length} works`, ''];
  for(const it of w.feed){ const t=dayclock(it.tick).toLowerCase(); if(it.kind==='say') L.push(`**${it.who}${it.to?' \u2192 '+it.to:''}** (${t}): ${it.text}`); else if(it.kind==='fact') L.push(`_${t}_ ${it.text.replace(/\n/g,' / ')}`); else if(it.kind==='art'){ const x=artById(w,it.artId); L.push(`**${it.who}** (${t}): ${it.text}`); if(x){ if(x.modality==='text') L.push(`> ${x.text}`); else { L.push(`![${x.id}](${x.renderedPreview})`); L.push('```', serializeProgram(x.program), '```'); } L.push(`likes: ${x.likes.length}`); for(const k of x.comments){ const b=agentById(w,k.agentId); L.push(`- ${b?b.name:'?'}: ${k.text}`); } if(x.session && x.session.agentPrompt) L.push(`prompt by maker: \u201c${x.session.agentPrompt}\u201d`); } } else if(it.kind==='news'){ L.push(`## ${it.who}: ${it.headline}`, it.text); } else if(it.kind==='work' && it.stages){ L.push(`**${it.who}** (${t}): prompted \u201c${it.stages.prompt}\u201d${it.artId? ' \u2192 '+it.artId : ''}`); } L.push(''); }
  const blob=new Blob([L.join('\n')],{type:'text/markdown'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='common-feed-'+w.id+'-'+Date.now()+'.md'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); };
let galTab='new';
let ptab='AGENT';
$('#prompts').onclick = ()=>{ const tabs=$('#ptabs'); tabs.innerHTML=''; for(const k of Object.keys(PROMPT_DEFAULTS)){ const b=h('button',k===ptab?'on':'',k); b.onclick=()=>{ savePrompt(); ptab=k; $('#prompts').onclick(); }; tabs.appendChild(b); } $('#ptext').value = PROMPTS[ptab]; openSheet('#promptsheet'); };
function savePrompt(){ PROMPTS[ptab] = $('#ptext').value; }
$('#ptext').addEventListener('input', savePrompt);
$('#preset').onclick = ()=>{ PROMPTS[ptab]=PROMPT_DEFAULTS[ptab]; $('#ptext').value=PROMPTS[ptab]; };

/* ---------- RENDER ---------- */
function render(){
  rafPending=false; const w=world(); if(!w){ dirty={}; return; }
  if(dirty.all||dirty.world||dirty.worldsoft) renderWorld();
  if(dirty.all||dirty.feed) renderFeed();
  if(dirty.all||dirty.clock||dirty.world) $('#clock').textContent = (worlds.length>1? w.id+' \u00b7 ':'') + dayclock(w.tick) + ' \u00b7 ' + fmtTok(AI.tokIn+AI.tokOut) + (PAUSED? ' \u00b7 PAUSED':'');
  const ctx=$('#ctx'); const a = ctxTarget? agentById(w,ctxTarget): null; ctx.classList.toggle('hide', !a); if(a){ $('#ctxlabel').textContent='reply to '+a.name; $('#say').placeholder='reply to '+a.name+'\u2026'; } else $('#say').placeholder='say / ask / make / change\u2026';
  dirty={};
}
let lastAnim=0, lastScope=null, feedAll=false;
function animLoop(ts){ requestAnimationFrame(animLoop); const w=world(); if(!w || !gScene) return; if(ts-lastAnim<33) return; lastAnim=ts;
  let moving=false;
  if(Math.abs(camTarget-cam)>.002){ cam += (camTarget-cam)*.18; moving=true; if(Math.abs(camTarget-cam)<.002) cam=camTarget; }
  for(const a of w.agents){ if(a.vx==null || a.sx==null) continue; const dx=a.sx-a.vx; if(Math.abs(dx)>.1){ a.vx+=dx*.06; moving=true; } }
  if(moving || (ts%1000)<40) drawNav();
  if(moving){ for(let i=0;i<6;i++) gBd[i].setAttribute('transform',`translate(${relX(i).toFixed(1)},0)`); for(const a of w.agents){ const g=nodeMap.get(a.id); if(!g || g.style.display==='none' || a.site==null) continue; g.setAttribute('transform',`translate(${(relX(a.site)+a.vx).toFixed(1)},${(a.vy||FLOOR).toFixed(1)})`); } for(const f of gFrames.children){ /* frames rebuilt on next render */ } if(Math.abs(camTarget-cam)<.05){ const sc=currentSite(); if(sc!==lastScope){ lastScope=sc; feedAll=false; markDirty('world'); markDirty('feed'); } } else { gFrames.style.opacity='.35'; } }
  else if(gFrames.style.opacity!=='') gFrames.style.opacity='';
}
requestAnimationFrame(animLoop);
{ const nv=$('#nav'); let nx=null, nc=0, nm=false; nv.addEventListener('pointerdown',e=>{ nx=e.clientX; nc=cam; nm=false; nv.setPointerCapture(e.pointerId); }); nv.addEventListener('pointermove',e=>{ if(nx==null) return; const dx=e.clientX-nx; if(Math.abs(dx)>4) nm=true; cam = nc + dx/60; camTarget=cam; markDirty('worldsoft'); }); nv.addEventListener('pointerup',e=>{ if(nx==null) return; if(!nm){ goSite(((Math.round(cam)%6)+6)%6 + (e.offsetX<45? -1:1)); } else camTarget=Math.round(cam); nx=null; }); }
setInterval(()=>{ if(!PAUSED && worlds.length) markDirty('worldsoft'); }, 1000);
startTitle();
</script>
